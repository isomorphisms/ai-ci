name: Pinned ICK compiler for host object files
description: Build and qualify the ICK frontend used by the independent graphics checks
outputs:
  compiler:
    description: Qualified x86_64-linux-gnu compiler driver
    value: ${{ steps.inputs.outputs.compiler }}
  source:
    description: Checkout containing the pinned compiler and GCC reference
    value: ${{ steps.inputs.outputs.source }}
  receipt:
    description: Observed build inputs and compiler identity
    value: ${{ steps.inputs.outputs.receipt }}
runs:
  using: composite
  steps:
    - name: Check out the pinned ICK source and GCC reference
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: dilapidated-shed/ick
        ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
        path: ick-toolchain
        submodules: true
        persist-credentials: false
    - name: Install compiler bootstrap dependencies
      shell: sh
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison texinfo \
          libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev binutils
    - name: Verify the source locks and record build inputs
      id: inputs
      shell: sh
      run: |
        set -eu
        source="$GITHUB_WORKSPACE/ick-toolchain"
        receipt="$RUNNER_TEMP/ick-host-objects-receipt"
        make -f "$GITHUB_ACTION_PATH/Makefile" check-source ICK_SOURCE="$source"
        mkdir -p "$receipt"
        {
          printf 'ick_revision\t%s\n' "$(git -C "$source" rev-parse HEAD)"
          printf 'gcc_revision\t%s\n' "$(git -C "$source/gcc" rev-parse HEAD)"
          dpkg-query -W gcc g++ binutils libc6 libgmp10 libmpfr6 libmpc3 libisl23 libzstd1
          sha256sum "$GITHUB_ACTION_PATH/Makefile"
        } > "$receipt/build-inputs.tsv"
        key=$(sha256sum "$receipt/build-inputs.tsv" | cut -d ' ' -f1)
        printf '%s\n' "source=$source" "stage=$source/stage" \
          "compiler=$source/stage/bin/x86_64-linux-gnu-gcc" "receipt=$receipt" \
          "cache_key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore the staged compiler for these exact inputs
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.inputs.outputs.stage }}
        key: ick-host-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.cache_key }}
    - name: Build ICK from the pinned source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: sh
      env:
        ICK_SOURCE: ${{ steps.inputs.outputs.source }}
      run: make -f "$GITHUB_ACTION_PATH/Makefile"
    - name: Qualify the actual ICK compiler and object-only host link
      shell: sh
      env:
        ICK_COMPILER: ${{ steps.inputs.outputs.compiler }}
        ICK_STAGE: ${{ steps.inputs.outputs.stage }}
        ICK_RECEIPT: ${{ steps.inputs.outputs.receipt }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -eu
        test -z "${GCC_EXEC_PREFIX-}${COMPILER_PATH-}"
        test "$("$ICK_COMPILER" -dumpmachine)" = x86_64-linux-gnu
        frontend=$(readlink -f -- "$("$ICK_COMPILER" -print-prog-name=cc1)")
        case "$frontend" in
          "$ICK_STAGE"/libexec/gcc/x86_64-linux-gnu/*/cc1) ;;
          *) printf '%s\n' 'ICK frontend is outside the pinned stage' >&2; exit 1 ;;
        esac
        sha256sum "$ICK_COMPILER" "$frontend" > "$ICK_RECEIPT/compiler.sha256"
        if [ "$CACHE_HIT" = true ]; then
          cmp "$ICK_STAGE/compiler.sha256" "$ICK_RECEIPT/compiler.sha256"
        fi
        "$ICK_COMPILER" -std=c17 -O2 -Wall -Wextra -Werror -pedantic -fPIC \
          -c "$GITHUB_ACTION_PATH/../ick-host/assignment-arrow.c" -o "$ICK_RECEIPT/glyphs.o"
        /usr/bin/x86_64-linux-gnu-gcc "$ICK_RECEIPT/glyphs.o" -o "$ICK_RECEIPT/glyphs"
        "$ICK_RECEIPT/glyphs"
        cp "$ICK_RECEIPT/compiler.sha256" "$ICK_STAGE/compiler.sha256"
        cat "$ICK_RECEIPT/compiler.sha256"
    - name: Save the qualified compiler before the graphics checks
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.inputs.outputs.stage }}
        key: ick-host-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.cache_key }}
