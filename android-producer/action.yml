name: AI CI authenticated Android producer decision
description: Verify exact APK bytes under the independently deployed active producer release
inputs:
  decision:
    description: Authenticated producer decision with mandatory signed witness
    required: true
  apk:
    description: Exact finished APK
    required: true
  source-commit:
    description: Source commit admitted by the registered operation
    required: true
  target:
    description: Fixed registered target
    required: true
  acceptance-scope:
    description: Explicit package scope
    required: true
runs:
  using: composite
  steps:
    - shell: sh
      env:
        DECISION: ${{ inputs.decision }}
        APK: ${{ inputs.apk }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        TARGET: ${{ inputs.target }}
        ACCEPTANCE_SCOPE: ${{ inputs.acceptance-scope }}
      # Thin foreign-runner boundary; no compiler/runtime bootstrap.
      run: |
        exec /usr/bin/env -i PATH=/usr/bin:/bin /opt/aici/android-producer/current/runtime/ysh /opt/aici/android-producer/current/policy/android-producer/check.ysh "$DECISION" "$APK" "$SOURCE_COMMIT" "$TARGET" "$ACCEPTANCE_SCOPE"
