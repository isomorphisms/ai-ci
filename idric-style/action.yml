name: Idriç source-style drift check
description: Check newly added Idriç-facing source for established hard stops and style canaries.

inputs:
  base:
    description: Base commit to compare against. If omitted, infer it from the GitHub event and fall back to HEAD^.
    required: false
    default: ''
  head:
    description: Head commit to check.
    required: false
    default: HEAD

runs:
  using: composite
  steps:
    - name: Check newly added Idriç source
      shell: sh
      env:
        AICI_IDRIC_STYLE_BASE: ${{ inputs.base }}
        AICI_IDRIC_STYLE_HEAD: ${{ inputs.head }}
        AICI_EVENT_NAME: ${{ github.event_name }}
        AICI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AICI_PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -eu

        base=$AICI_IDRIC_STYLE_BASE
        head=$AICI_IDRIC_STYLE_HEAD

        if [ -z "$base" ]; then
          base=$AICI_PUSH_BEFORE_SHA
          if [ "$AICI_EVENT_NAME" = "pull_request" ]; then
            base=$AICI_PR_BASE_SHA
          fi
        fi

        case "$base" in
          ""|0000000000000000000000000000000000000000)
            base="$(git rev-parse "$head^")"
            ;;
        esac

        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          base="$(git rev-parse "$head^")"
        fi

        sh "$GITHUB_ACTION_PATH/check_added_source" "$base" "$head"
