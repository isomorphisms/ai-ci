name: Host-context trace consistency audit (legacy)
description: Audit supplied declarations only; this does NOT authorize or mediate execution
inputs:
  trace:
    description: Claimed TSV history to audit, not an execution permission or proof of observation
    required: true
runs:
  using: composite
  steps:
    - name: Compile legacy trace auditor
      shell: sh
      run: |
        set -eu
        cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
          "$GITHUB_ACTION_PATH/../src/aici_host_context.c" \
          -o "$RUNNER_TEMP/aici-host-context"
    - name: Check trace consistency, not actual execution
      shell: sh
      env:
        HC_AUDIT_TRACE: ${{ inputs.trace }}
      run: |
        set -eu
        "$RUNNER_TEMP/aici-host-context" check "$HC_AUDIT_TRACE"
