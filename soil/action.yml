name: ai-ci Soil job receipt
description: Run one substantive Soil job at an exact source revision without upstream publishing

inputs:
  root:
    description: Checked-out Oils/Soil source tree
    required: false
    default: .
  job:
    description: Soil job name, for example cpp-spec
    required: true
  expected_revision:
    description: Exact 40-hex source revision that Soil must execute
    required: true
  container:
    description: Container runner passed to Soil
    required: false
    default: podman

outputs:
  receipt:
    description: Verified local Soil receipt TSV
    value: ${{ steps.verify.outputs.receipt }}

runs:
  using: composite
  steps:
    - name: Compile independent Soil receipt verifier
      shell: sh
      run: |
        set -eu
        cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
          "$GITHUB_ACTION_PATH/src/aici_soil.c" \
          -o "$RUNNER_TEMP/aici-soil"

    - name: Bind execution to the exact source revision
      shell: sh
      env:
        AICI_SOIL_ROOT: ${{ inputs.root }}
        AICI_SOIL_JOB: ${{ inputs.job }}
        AICI_SOIL_EXPECTED_REVISION: ${{ inputs.expected_revision }}
      run: |
        set -eu
        case "$AICI_SOIL_JOB" in
          ''|*[!A-Za-z0-9_-]*)
            echo "invalid Soil job name: $AICI_SOIL_JOB" >&2
            exit 2
            ;;
        esac
        actual_revision=$(git -C "$AICI_SOIL_ROOT" rev-parse HEAD)
        test "$actual_revision" = "$AICI_SOIL_EXPECTED_REVISION"
        test -x "$AICI_SOIL_ROOT/soil/github-actions.sh"

    - name: Run substantive Soil job without publisher
      shell: sh
      env:
        AICI_SOIL_ROOT: ${{ inputs.root }}
        AICI_SOIL_JOB: ${{ inputs.job }}
        AICI_SOIL_CONTAINER: ${{ inputs.container }}
      run: |
        set -eu
        cd "$AICI_SOIL_ROOT"
        soil/github-actions.sh run-job "$AICI_SOIL_JOB" "$AICI_SOIL_CONTAINER"

    - name: Verify local Soil evidence
      id: verify
      shell: sh
      env:
        AICI_SOIL_ROOT: ${{ inputs.root }}
        AICI_SOIL_JOB: ${{ inputs.job }}
        AICI_SOIL_EXPECTED_REVISION: ${{ inputs.expected_revision }}
      run: |
        set -eu
        receipt="$RUNNER_TEMP/aici-soil-$AICI_SOIL_JOB.receipt.tsv"
        "$RUNNER_TEMP/aici-soil" verify \
          "$AICI_SOIL_ROOT" "$AICI_SOIL_JOB" "$AICI_SOIL_EXPECTED_REVISION" \
          > "$receipt"
        cat "$receipt"
        printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
