name: Enforce Debian GitHub runner policy
description: Reject GitHub Actions runner drift and unsafe public self-hosted PR jobs.
inputs:
  root:
    description: Repository root to scan.
    required: false
    default: .
  exceptions:
    description: Repository-relative runner exception TSV, or - when none are allowed.
    required: false
    default: '-'
  visibility:
    description: Repository visibility for fork-safety enforcement (public or private).
    required: false
    default: public
runs:
  using: composite
  steps:
    - name: Compile GitHub policy verifier
      shell: sh
      run: |
        cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
          -o "$RUNNER_TEMP/aici-github" "$GITHUB_ACTION_PATH/../src/aici_github.c"
    - name: Enforce GitHub runner policy
      shell: sh
      run: |
        "$RUNNER_TEMP/aici-github" verify \
          "${{ inputs.root }}" "${{ inputs.exceptions }}" "${{ inputs.visibility }}"
