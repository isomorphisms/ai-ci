name: ai-ci independent complete-build comparison
description: Compare two independently witnessed consumer builds against fixed approved material

inputs:
  contract:
    description: Approved independent-build contract TSV
    required: true
  left-attempt:
    description: First build attempt receipt TSV
    required: true
  left-output-root:
    description: First build output root retained for independent hashing
    required: true
  right-attempt:
    description: Second build attempt receipt TSV
    required: true
  right-output-root:
    description: Second build output root retained for independent hashing
    required: true
  ndk-receipt-schema:
    description: Exact android-NDK S01 nativeactivity receipt v2 schema
    required: true

outputs:
  verdict:
    description: Path to the exact AICI reproducibility verdict TSV
    value: ${{ steps.verify.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Acquire exact partial native Grease for scoped source execution
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '14083485063'
        run-id: '43520333267'
        repository: dilapidated-shed/oils
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/aici-repro-grease-artifact

    - name: Bind native Grease bytes at the artifact transport boundary
      shell: sh
      run: >-
        cmake
        -DARTIFACT_ROOT="${{ runner.temp }}/aici-repro-grease-artifact"
        -DRUNTIME_ROOT="${{ runner.temp }}/aici-repro-grease"
        -P "${{ github.action_path }}/PrepareGrease.cmake"

    - name: Select the qualified ICK C compiler
      uses: isomorphisms/ai-ci/ick-host@c64df1546986affdddddd5ea37b601d287835577
      id: ick

    - name: Compile independent build comparator
      shell: /usr/bin/env grease {0}
      env:
        AICI_REPRO_COMPILER: ${{ steps.ick.outputs.compiler }}
      run: >-
        "$RUNNER_TEMP/aici-repro-grease/grease" "$GITHUB_ACTION_PATH/driver.grease"
        compile "$AICI_REPRO_COMPILER" "$GITHUB_ACTION_PATH/.."
        "$RUNNER_TEMP/aici-reproducibility"

    - name: Compare retained build bytes and receipts
      id: verify
      shell: /usr/bin/env grease {0}
      env:
        AICI_REPRO_CONTRACT: ${{ inputs.contract }}
        AICI_REPRO_LEFT_ATTEMPT: ${{ inputs.left-attempt }}
        AICI_REPRO_LEFT_ROOT: ${{ inputs.left-output-root }}
        AICI_REPRO_RIGHT_ATTEMPT: ${{ inputs.right-attempt }}
        AICI_REPRO_RIGHT_ROOT: ${{ inputs.right-output-root }}
        AICI_REPRO_NDK_SCHEMA: ${{ inputs.ndk-receipt-schema }}
      run: >-
        "$RUNNER_TEMP/aici-repro-grease/grease" "$GITHUB_ACTION_PATH/driver.grease"
        verify "$RUNNER_TEMP/aici-reproducibility" "$AICI_REPRO_CONTRACT"
        "$AICI_REPRO_LEFT_ATTEMPT" "$AICI_REPRO_LEFT_ROOT"
        "$AICI_REPRO_RIGHT_ATTEMPT" "$AICI_REPRO_RIGHT_ROOT"
        "$AICI_REPRO_NDK_SCHEMA" "$RUNNER_TEMP/aici-independent-build-verdict.tsv"
        "$GITHUB_OUTPUT"

