name: "AI CI"
description: "Strict AI-oriented repository checks"
inputs:
  root:
    description: "Repository root"
    required: false
    default: "."
  suite:
    description: "Suite file, relative to repository root"
    required: false
    default: ".github/ai-ci/suite.tsv"
runs:
  using: "composite"
  steps:
    - shell: sh
      env:
        AICI_ROOT: ${{ inputs.root }}
        AICI_SUITE: ${{ inputs.suite }}
      run: |
        set -eu

        if [ -z "${RUNNER_TEMP:-}" ]; then
          echo "RUNNER_TEMP is required"
          exit 2
        fi

        cc -std=c17 -Wall -Wextra -Werror -O2 \
          "$GITHUB_ACTION_PATH/src/aici.c" \
          -o "$RUNNER_TEMP/aici"

        cc -std=c17 -Wall -Wextra -Werror -O2 \
          "$GITHUB_ACTION_PATH/src/check_idric_gitattributes.c" \
          -o "$RUNNER_TEMP/aici-idric-gitattributes"

        "$RUNNER_TEMP/aici-idric-gitattributes" "$AICI_ROOT"
        "$RUNNER_TEMP/aici" suite "$AICI_SUITE" "$AICI_ROOT"
