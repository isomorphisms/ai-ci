name: "AI CI"
description: "Strict AI-oriented repository checks"
inputs:
  root:
    description: "Repository root"
    required: false
    default: "."
  suite:
    description: "Suite file, relative to repository root"
    required: false
    default: ".github/ai-ci/suite.tsv"
outputs:
  evidence:
    description: "Fresh directory containing the selected-case plan, process observations and raw logs"
    value: ${{ steps.verify.outputs.evidence }}
runs:
  using: "composite"
  steps:
    - name: Select the qualified C verifier compiler
      id: compiler
      uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
    - id: verify
      shell: sh
      env:
        AICI_ROOT: ${{ inputs.root }}
        AICI_SUITE: ${{ inputs.suite }}
        AICI_SOURCE_IDENTITY: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -eu

        if [ -z "${RUNNER_TEMP:-}" ]; then
          echo "RUNNER_TEMP is required"
          exit 2
        fi

        "${{ steps.compiler.outputs.compiler }}" ${{ steps.compiler.outputs.link_flags }} -std=c17 -Wall -Wextra -Werror -O2 \
          "$GITHUB_ACTION_PATH/src/aici.c" \
          -o "$RUNNER_TEMP/aici"

        "${{ steps.compiler.outputs.compiler }}" ${{ steps.compiler.outputs.link_flags }} -std=c17 -Wall -Wextra -Werror -O2 \
          "$GITHUB_ACTION_PATH/src/check_idric_gitattributes.c" \
          -o "$RUNNER_TEMP/aici-idric-gitattributes"

        "${{ steps.compiler.outputs.compiler }}" ${{ steps.compiler.outputs.link_flags }} -std=c17 -Wall -Wextra -Werror -O2 \
          "$GITHUB_ACTION_PATH/stage-verdict/src/aici_stage_verdict.c" \
          -o "$RUNNER_TEMP/aici-stage-verdict"

        # GitHub composite bootstrap boundary; process observations live in C.
        evidence=$(mktemp -d "$RUNNER_TEMP/aici-core-action.XXXXXXXX")/execution
        printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
        exec "$RUNNER_TEMP/aici" action-suite "$AICI_SUITE" "$AICI_ROOT" \
          "$RUNNER_TEMP/aici-idric-gitattributes" "$RUNNER_TEMP/aici-stage-verdict" \
          "$evidence" "$AICI_SOURCE_IDENTITY"
