name: Pinned native ICK compiler
description: Bootstrap the exact ICK C frontend; no consumer compiler fallback.
outputs:
  compiler:
    description: Absolute path to the qualified native ICK compiler.
    value: ${{ steps.compiler.outputs.compiler }}
  link_flags:
    description: Native scalar profile excludes unqualified automatic libatomic linkage.
    value: -fno-link-libatomic
  static_runtime_flags:
    description: Append after static consumer objects for the declared glibc and GCC unwind runtime.
    value: -Wl,--start-group -lc -lgcc_eh -Wl,--end-group
runs:
  using: composite
  steps:
    - name: Select paths for the pinned compiler revision
      id: paths
      shell: sh
      run: |
        set -eu
        revision=fbe86e23d55cfec2000c08e61deea2a407fd7175
        root="$RUNNER_TEMP/ick-host-$revision"
        printf '%s\n' "revision=$revision" "checkout=.ick-host-source-$revision" \
          "build=$root/build" "stage=$root/stage" >> "$GITHUB_OUTPUT"
    - name: Check out the exact ICK source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dilapidated-shed/ick
        ref: ${{ steps.paths.outputs.revision }}
        path: ${{ steps.paths.outputs.checkout }}
        submodules: true
        persist-credentials: false
    - name: Install compiler bootstrap dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
    - name: Identify the declared native runtime
      id: runtime
      shell: bash
      env:
        ICK_BUILD: ${{ steps.paths.outputs.build }}
      run: make -f "$GITHUB_ACTION_PATH/Makefile" cache-key >> "$GITHUB_OUTPUT"
    - name: Restore the exact compiler and native runtime
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.paths.outputs.stage }}
        key: ick-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.revision }}-${{ steps.runtime.outputs.runtime_key }}
    - name: Build ICK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ICK_SOURCE: ${{ github.workspace }}/${{ steps.paths.outputs.checkout }}
        ICK_BUILD: ${{ steps.paths.outputs.build }}
        ICK_STAGE: ${{ steps.paths.outputs.stage }}
      run: make -f "$GITHUB_ACTION_PATH/Makefile"
    - name: Qualify assignment, multiplication and division
      shell: bash
      env:
        ICK_SOURCE: ${{ github.workspace }}/${{ steps.paths.outputs.checkout }}
        ICK_STAGE: ${{ steps.paths.outputs.stage }}
      run: make -f "$GITHUB_ACTION_PATH/Makefile" qualify
    - name: Export compiler path
      id: compiler
      shell: bash
      env:
        ICK_STAGE: ${{ steps.paths.outputs.stage }}
      run: printf 'compiler=%s\n' "$ICK_STAGE/bin/gcc" >> "$GITHUB_OUTPUT"
    - name: Preserve the qualified compiler before consumer work
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.paths.outputs.stage }}
        key: ick-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.revision }}-${{ steps.runtime.outputs.runtime_key }}
