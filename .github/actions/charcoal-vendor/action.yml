name: Shared charcoal vendor contract
description: Compare application copies with the immutable presentation owner through canonical Grease.
inputs:
  header:
    description: Absolute vendored C header path, or dash for a resource-only consumer.
    default: '-'
  resources:
    description: Absolute application resource directory.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: isomorphisms/android-NDK
        ref: e8b67dfc67776c2b8da919785d15f38d68c91db0
        path: .charcoal-owner
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        repository: dilapidated-shed/grease
        run-id: 41253994123
        artifact-ids: 13062637698
        merge-multiple: true
        github-token: ${{ github.token }}
        path: grease
    - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@ebfb667b64009f0c0bdf9dcfafb7884196786ef5
    - name: Compare the actual maintained copies
      shell: bash
      env:
        ASAN_OPTIONS: detect_leaks=0
        VENDOR_HEADER: ${{ inputs.header }}
        VENDOR_RESOURCES: ${{ inputs.resources }}
      run: '"$GITHUB_WORKSPACE/grease/bin/grease" "$GITHUB_ACTION_PATH/../../../charcoal/verify-vendored.grease" "$GITHUB_WORKSPACE/.charcoal-owner" "$VENDOR_HEADER" "$VENDOR_RESOURCES"'
