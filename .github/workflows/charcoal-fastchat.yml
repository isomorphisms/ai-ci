name: Independent charcoal FastChat acceptance
on:
  pull_request:
    paths:
      - charcoal/check-frame.grease
      - charcoal/self-test.grease
      - examples/autogenerated/native-presentation/**
      - .github/workflows/charcoal-fastchat.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  charcoal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/fastchat
          ref: 1a810df430b41ea52a372e7bba1c01dc1df81512
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 41942024102
          artifact-ids: 13376014519
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Verify exact signed input
        run: >
          "$CHARCOAL_GREASE" examples/autogenerated/native-presentation/verify-fastchat-input.grease
          "$GITHUB_WORKSPACE/candidate/fastchat.apk" 1a810df430b41ea52a372e7bba1c01dc1df81512
          "$ANDROID_HOME" "$RUNNER_TEMP/charcoal-input"
      - name: Build the independent observer
        run: >
          "$CHARCOAL_GREASE" examples/autogenerated/native-presentation/prepare-fastchat.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/product" "$ANDROID_HOME" "$GITHUB_WORKSPACE/smali.jar"
          "$GITHUB_WORKSPACE/product/android/signing/fastchat-comparison-dev.jks" "$RUNNER_TEMP/charcoal-observer"
      - run: sudo chmod 666 /dev/kvm
      - name: Execute fixed palette, live negatives and functional controls
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            "$CHARCOAL_GREASE" examples/autogenerated/native-presentation/observe-fastchat.grease
            "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/candidate/fastchat.apk"
            "$RUNNER_TEMP/charcoal-observer" "$RUNNER_TEMP/charcoal-observed" "${{ matrix.api }}" required-timeline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charcoal-FastChat-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/charcoal-input
            ${{ runner.temp }}/charcoal-observer
            ${{ runner.temp }}/charcoal-observed
