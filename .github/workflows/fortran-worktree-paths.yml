name: Fortran verifier worktree paths

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify relocated paths and reject malformed or escaping maps
        run: node fortran-coverage/worktree-paths.test.mjs
