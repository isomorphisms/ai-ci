name: Android producer qualification prerequisite
on:
  pull_request:
    paths: ["android-producer/**", ".github/workflows/android-producer-self-test.yml"]
  push:
    branches: [main]
    paths: ["android-producer/**", ".github/workflows/android-producer-self-test.yml"]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Require independent qualified deployment
        shell: sh
        run: |
          test -x /opt/aici/android-producer/current/runtime/grease || { echo '::error::BLOCKED: qualified Android producer runtime/release not deployed on this runner'; exit 1; }
          exec /usr/bin/env -i PATH=/usr/bin:/bin /opt/aici/android-producer/current/runtime/grease /opt/aici/android-producer/current/policy/android-producer/preflight.ysh
