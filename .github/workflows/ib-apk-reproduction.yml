name: Independently reproduce signed direct APK packaging
on:
  pull_request:
    paths:
      - '.github/workflows/ib-apk-reproduction.yml'
      - 'examples/autogenerated/ib-apk-reproduction/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared host runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: d02fe516833d0941e8ff1ab2b84369c1661aee6c
          path: .tools/fixture-ib
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 153e7fc8053ba4072954a5e77d4efa3609d829e4
          path: .tools/backend
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 9861b303a7e6d989125d80cee552a46cb2503555
          path: .tools/baseline-backend
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Install declared literal-text verification
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Parse before any artifact read or packaging
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/ib-apk-reproduction/reproduce.grease
      - name: Repackage identical frozen inputs at different times
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-apk-reproduction/reproduce.grease "$ANDROID_HOME" "$GITHUB_WORKSPACE/.tools/fixture-ib" "$GITHUB_WORKSPACE/.tools/backend" "$GITHUB_WORKSPACE/.tools/baseline-backend" "$RUNNER_TEMP/ib-apk-reproduction"
      - name: Retain packaging observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-APK-reproduction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ib-apk-reproduction/receipt.tsv
            ${{ runner.temp }}/ib-apk-reproduction/*.txt
            ${{ runner.temp }}/ib-apk-reproduction/*.exit
            ${{ runner.temp }}/ib-apk-reproduction/*.sha256
            ${{ runner.temp }}/ib-apk-reproduction/*/evidence
          if-no-files-found: warn
