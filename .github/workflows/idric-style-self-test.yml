name: Idriç style self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  idric-style-self-test:
    name: ${{ github.event_name == 'pull_request' && 'idric-style-self-test' || format('idric-style-self-test-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove hard stops and warnings
        shell: sh
        run: sh idric-style/tests/self_test.sh
      - name: Exercise the reusable action
        uses: ./idric-style
