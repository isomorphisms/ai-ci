name: Independent signed IB native presentation
on:
  pull_request:
    paths:
      - .github/workflows/ib-native-presentation.yml
      - examples/autogenerated/native-presentation/prepare-ib-requalification.grease
      - examples/autogenerated/native-presentation/observe-ib-requalification.grease
      - examples/autogenerated/native-presentation/observe-art.grease
      - examples/autogenerated/native-presentation/WorkbenchProbe.smali
      - ib-source/shizuku/observe-link-shapes.grease
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-IB-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-ib:
    name: Exact signed IB API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      IB_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 6f88d23d337c17e076ded68a308542f0955b921e
          path: product
          persist-credentials: false
      - name: Original producer observer pin, retained for archive verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 67b425686234e9cb007e5b16a69611b42cfbabc0
          path: product/.tools/reader-acceptance
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x "$IB_GREASE"
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Verify existing signed source-bound producer archive without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          "$IB_GREASE" product/examples/autogenerated/tabp10-reader/verify-observation-input.grease
          "$GITHUB_WORKSPACE/product" 6f88d23d337c17e076ded68a308542f0955b921e
          13290449853 90ef500f928e2f8b387ada8bfc3163a6caf94b57d68e9dad3d555f13d3f431b2
          "$RUNNER_TEMP/ib-reader" "$RUNNER_TEMP/ib-input"
      - name: Preserve ICK and reclaim only job-owned compiler intermediates
        run: >
          "$IB_GREASE" examples/autogenerated/ib-native-network/prepare-emulator-host.grease
          "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/ib-host-capacity"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Compile repaired independent probe and preserve immutable product bytes
        run: >
          "$IB_GREASE" examples/autogenerated/native-presentation/prepare-ib-requalification.grease
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-reader" "$RUNNER_TEMP/ib-presentation" "$IB_GREASE"
      - run: sudo chmod 666 /dev/kvm
      - name: Execute source mutations, real native acquisition, retained history and reader UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '${{ matrix.api }}'
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            "$IB_GREASE" examples/autogenerated/native-presentation/observe-ib-requalification.grease
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-presentation/runtime-input" "$RUNNER_TEMP/ib-presentation"
            "$ANDROID_HOME" "${{ steps.ick.outputs.compiler }}" "${{ matrix.api }}" "$RUNNER_TEMP/ib-observed" "$IB_GREASE"
      - name: Retain exact-source independent evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-IB-API${{ matrix.api }}-6f88d23d-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ib-input/*.txt
            ${{ runner.temp }}/ib-input/*.tsv
            ${{ runner.temp }}/ib-input/*.sha256
            ${{ runner.temp }}/ib-presentation
            ${{ runner.temp }}/ib-observed
