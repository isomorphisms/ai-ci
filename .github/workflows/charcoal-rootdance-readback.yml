name: Retained root-drag failure readback
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-rootdance-readback.yml
      - examples/autogenerated/charcoal-rootdance-readback/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retained-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphismes/coefficient-root-dance
          run-id: 42005361547
          artifact-ids: 13405419199
          github-token: ${{ github.token }}
          merge-multiple: true
          path: retained-rootdance
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .ithon
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Lib/ithon_run.py
            Lib/ithon_frontend.py
            Lib/ithon_static.py
      - name: Admit exact retained-image reader before installing dependencies
        run: python3 .ithon/Lib/ithon_run.py -c 'from ithon_frontend import check_file; check_file("examples/autogenerated/charcoal-rootdance-readback/read.pi")'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - run: grease/bin/grease examples/autogenerated/charcoal-rootdance-readback/read.grease
      - run: python3 -m venv .image-runtime
      - run: .image-runtime/bin/pip install Pillow==11.0.0
      - name: Read actual shader-color pixel bands through checked Ithon
        env:
          ITHON_CHECK_RECEIPT: ${{ github.workspace }}/rootdance-readback/ithon-check-receipt.jsonl
        run: .image-runtime/bin/python .ithon/Lib/ithon_run.py examples/autogenerated/charcoal-rootdance-readback/read.pi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-rootdance-diagnostic-readback
          path: rootdance-readback/
          if-no-files-found: warn
