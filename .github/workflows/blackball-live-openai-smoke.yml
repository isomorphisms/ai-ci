name: Blackball live OpenAI smoke

on:
  push:
    branches:
      - blackball-eval-consolidation
    paths:
      - '.github/workflows/blackball-live-openai-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-openai-smoke:
    runs-on: ubuntu-24.04
    environment: openai-live
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Send one genuine prompt
        shell: python
        env:
          AICI_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          import json
          import os
          import subprocess
          import sys

          available = json.loads(os.environ.get("AICI_SECRETS_JSON", "{}"))
          candidates = [name for name, value in available.items()
                        if name != "GITHUB_TOKEN" and value]
          print("available user secret names:", ", ".join(sorted(candidates)) or "(none)")

          if "OPENAI_API_KEY" in candidates:
              secret_name = "OPENAI_API_KEY"
          elif len(candidates) == 1:
              secret_name = candidates[0]
          else:
              raise SystemExit("could not identify the OpenAI API key secret")

          child_env = os.environ.copy()
          child_env["OPENAI_API_KEY"] = available[secret_name]
          completed = subprocess.run(
              [sys.executable, "evals/blackball/openai_responses_cli.py", "gpt-5.6-luna"],
              input="Reply with exactly: live provider reached\n",
              text=True,
              capture_output=True,
              env=child_env,
          )
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          if completed.stdout.strip() != "live provider reached":
              raise SystemExit("provider answered, but not with the requested exact smoke text")
          print("\nLIVE-PROVIDER-SMOKE: PASS")
