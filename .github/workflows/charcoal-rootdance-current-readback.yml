name: Current forced-relaunch failure readback
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-rootdance-current-readback.yml
      - examples/autogenerated/charcoal-rootdance-readback/read-current.grease
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        retained:
          - name: API29-initial-no
            artifact: 13419668851
          - name: API35-initial-yes
            artifact: 13420875612
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphismes/coefficient-root-dance
          run-id: 42039139948
          artifact-ids: ${{ matrix.retained.artifact }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: retained-current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Read immutable current failure boundaries
        run: grease/bin/grease examples/autogenerated/charcoal-rootdance-readback/read-current.grease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-rootdance-readback-${{ matrix.retained.name }}
          path: current-readback/
          if-no-files-found: warn
