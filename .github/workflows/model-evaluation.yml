name: Model prompt evaluation harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checked-ithon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Execute the actual Ithon frontend and grader controls
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/model-evaluation-checked.jsonl
        run: _ithon/ithon model-evaluation/evaluate.pi self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: model-evaluation-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/model-evaluation-checked.jsonl
          if-no-files-found: error
