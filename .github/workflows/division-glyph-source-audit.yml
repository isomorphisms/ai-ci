name: Division glyph audit self-test

on:
  pull_request:
    paths:
      - 'scripts/audit_division_glyph.py'
      - 'tests/division_glyph/**'
      - 'examples/autogenerated/division-glyph-migration/**'
      - 'benchmarks/iridium-2014/IdricBench.idric'
      - '.github/workflows/division-glyph-source-audit.yml'
  push:
    paths:
      - 'scripts/audit_division_glyph.py'
      - 'tests/division_glyph/**'
      - 'examples/autogenerated/division-glyph-migration/**'
      - 'benchmarks/iridium-2014/IdricBench.idric'
      - '.github/workflows/division-glyph-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run lexical classifier regression
        run: python3 -m unittest discover -s tests/division_glyph -p 'test_*.py' -v
      - name: Produce self-repo read-only report
        run: |
          python3 scripts/audit_division_glyph.py . > /tmp/division-glyph.json
          python3 -m json.tool /tmp/division-glyph.json >/dev/null
      - name: Preserve scanner smoke receipt
        run: |
          printf '%s\n' 'PASS: source scanner self-tests and JSON' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'NOT VERIFIED: fleet-wide source migration, compiler or device execution' >> "$GITHUB_STEP_SUMMARY"

  idric-c-lexer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out division-capable Idriç
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: _division-idric
          persist-credentials: false
      - name: Install the declared bootstrap dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build exact Idriç
        working-directory: _division-idric
        run: |
          ./edric scheme
          PATH="$PWD/_/.tools/bin:$PATH" ./edric bootstrap
      - name: Compile and execute the C token scanner
        working-directory: examples/autogenerated/division-glyph-migration
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_division-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_division-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_division-idric/_/libs/base/build/ttc
          CHEZ: ${{ github.workspace }}/_division-idric/_/.tools/bin/scheme
        run: |
          "$GITHUB_WORKSPACE/_division-idric/_/build/exec/idris2" --no-banner --no-color -o division-glyph-scan AuditC.idric
          build/exec/division-glyph-scan --self-test
      - name: Execute the migrated Idriç benchmark against its fixed output
        working-directory: benchmarks/iridium-2014
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_division-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_division-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_division-idric/_/libs/base/build/ttc
          CHEZ: ${{ github.workspace }}/_division-idric/_/.tools/bin/scheme
        run: |
          "$GITHUB_WORKSPACE/_division-idric/_/build/exec/idris2" --no-banner --no-color -o idric-benchmark IdricBench.idric
          build/exec/idric-benchmark > "$RUNNER_TEMP/idric-benchmark-output.txt"
          cmp expected-output.txt "$RUNNER_TEMP/idric-benchmark-output.txt"
