name: historical Idris backend source probes

on:
  push:
    paths:
      - compiler_backends/**
      - .github/workflows/compiler-backend-observations.yml
  pull_request:
    paths:
      - compiler_backends/**
      - .github/workflows/compiler-backend-observations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out AICI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out historical Idriç ARM/Thumb experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/idric-arm-thumb
          ref: 7bc8d71e76d2b75028f923dc7655ab245d4d0cf8 # closed ARM/Thumb PR #1
          path: _backends/idric-arm-thumb

      - name: Check out Idris ARM backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/idris-arm-backend
          ref: main
          path: _backends/idris-arm-backend

      - name: Check out FP16 GLSL ES backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/idris-shader-backend
          ref: main
          path: _backends/idris-shader-backend

      - name: Check out historical Algebraic Variety Explorer FP16 consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/algebraic-variety-explorer-mobile
          ref: 3d19d464b7fbf2400b6f3a9ebd08f9758bee80ce # closed AVE PR #12; branch removed
          path: _consumers/algebraic-variety-explorer-mobile

      - name: Compile deterministic observers
        run: |
          cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
            -o "$RUNNER_TEMP/compiler-backend-probe" compiler_backends/probe.c
          cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
            -o "$RUNNER_TEMP/fp16-baseline" compiler_backends/fp16_baseline.c

      - name: Self-test deterministic observer
        run: |
          "$RUNNER_TEMP/compiler-backend-probe" --self-test
          "$RUNNER_TEMP/fp16-baseline" --self-test

      - name: Measure the same feature surface across backends
        run: |
          "$RUNNER_TEMP/compiler-backend-probe" \
            --matrix compiler_backends/probes.tsv \
            --root idric-arm-thumb=_backends/idric-arm-thumb \
            --root idris-arm-backend=_backends/idris-arm-backend \
            --root idris-shader-backend=_backends/idris-shader-backend \
            --output compiler-backend-observations.tsv

      - name: Measure FP16 and PowerVR implementation surface
        run: |
          "$RUNNER_TEMP/compiler-backend-probe" \
            --matrix compiler_backends/fp16_probes.tsv \
            --root idris-shader-backend=_backends/idris-shader-backend \
            --output fp16-powervr-observations.tsv

      - name: Measure downstream FP16 consumer surface
        run: |
          "$RUNNER_TEMP/compiler-backend-probe" \
            --matrix compiler_backends/fp16_consumers.tsv \
            --root algebraic-variety-explorer-mobile=_consumers/algebraic-variety-explorer-mobile \
            --output fp16-consumer-observations.tsv

      - name: Verify established FP16 and PowerVR baseline
        run: |
          "$RUNNER_TEMP/fp16-baseline" \
            --expected compiler_backends/fp16_expected.tsv \
            --observations fp16-powervr-observations.tsv

      - name: Record observed revisions
        run: |
          {
            printf 'source\tref\trevision\n'
            printf 'idric-arm-thumb\tclosed-pr-1-head\t%s\n' "$(git -C _backends/idric-arm-thumb rev-parse HEAD)"
            printf 'idris-arm-backend\tmain\t%s\n' "$(git -C _backends/idris-arm-backend rev-parse HEAD)"
            printf 'idris-shader-backend\tmain\t%s\n' "$(git -C _backends/idris-shader-backend rev-parse HEAD)"
            printf 'algebraic-variety-explorer-mobile\tclosed-pr-12-head\t%s\n' "$(git -C _consumers/algebraic-variety-explorer-mobile rev-parse HEAD)"
          } > compiler-backend-revisions.tsv

      - name: Publish observation in the job summary
        run: |
          {
            echo '### Historical backend source probes'
            echo 'These experiment refs do not establish current backend or consumer acceptance.'
            echo
            echo '```text'
            cat compiler-backend-revisions.tsv
            echo
            cat compiler-backend-observations.tsv
            echo
            echo 'FP16 / PowerVR surface:'
            cat fp16-powervr-observations.tsv
            echo
            echo 'Downstream FP16 consumer surface:'
            cat fp16-consumer-observations.tsv
            echo '```'
            echo
            echo 'Established FP16 policy, tests, and whole-shader compiler facts are gated by fp16_expected.tsv.'
            echo 'The Algebraic Variety Explorer rows observe an independent downstream compile gate; they do not claim runtime PowerVR framebuffer evidence.'
            echo 'Mixed-width IR, explicit conversion, source-level F16, and real-device evidence remain separate milestones.'
          } >> "$GITHUB_STEP_SUMMARY"
