name: Secure FastChat settings charcoal acceptance
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-fastchat-settings.yml
      - examples/autogenerated/native-presentation/ContentOwnerTask.smali
      - examples/autogenerated/native-presentation/FastChatUi.smali
      - examples/autogenerated/charcoal-secure-settings/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/fastchat
          ref: 07b609e3c30c54d361149f739785a57a51514efb
          path: producer-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 42005246209
          artifact-ids: 13404806762
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate
      - run: echo 'b56e31ebee849e6faadd0c0b5c399ffa259b6f5a5e3b532573333db025ae47a4  candidate/fastchat.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Verify immutable producer identity and build the existing direct-DEX observer
        run: '"$CHARCOAL_GREASE" examples/autogenerated/native-presentation/verify-fastchat-input.grease "$GITHUB_WORKSPACE/candidate/fastchat.apk" 07b609e3c30c54d361149f739785a57a51514efb "$ANDROID_HOME" "$RUNNER_TEMP/settings-input"'
      - run: '"$CHARCOAL_GREASE" examples/autogenerated/native-presentation/prepare-fastchat.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/producer-source" "$ANDROID_HOME" "$GITHUB_WORKSPACE/smali.jar" "$GITHUB_WORKSPACE/producer-source/android/signing/fastchat-comparison-dev.jks" "$RUNNER_TEMP/settings-observer"'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$CHARCOAL_GREASE" examples/autogenerated/charcoal-secure-settings/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/candidate/fastchat.apk" "$RUNNER_TEMP/settings-observer" "$RUNNER_TEMP/secure-settings" "${{ matrix.api }}"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: secure-settings-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/settings-input/
            ${{ runner.temp }}/settings-observer/
            ${{ runner.temp }}/secure-settings/
          if-no-files-found: warn
