name: Independent framebuffer stack numerical and memory acceptance
on:
  pull_request:
    paths:
      - 'framebuffer/**'
      - 'subpixel/receipt_check.c'
      - 'ick-host-objects/**'
      - 'ick-host/assignment-arrow.c'
      - 'grease-fixtures/**'
      - '.github/workflows/framebuffer-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framebuffer-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HOST_LINKER: /usr/bin/x86_64-linux-gnu-gcc
      STACK_SOURCE_REPO: ${{ github.workspace }}/producer
      STACK_OUTPUT: ${{ github.workspace }}/framebuffer/build/stack
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/rough.framebuffer
          ref: dd42b897026e8f652bfe865018a4f42b0aaf868c
          fetch-depth: 0
          path: producer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ike
          ref: a92fe68bf8aad8dfcfe9f7a7abd84e07290f7fe0
          path: ike-source
          persist-credentials: false
      - name: Build the pinned ICK object compiler
        uses: ./ick-host-objects
        id: ick
      - name: Build the pinned native Grease runtime
        uses: ./grease-fixtures
        id: grease
      - name: Select the built Grease shell for the following steps
        shell: sh
        env:
          GREASE_BINARY: ${{ steps.grease.outputs.executable }}
        run: dirname "$GREASE_BINARY" >> "$GITHUB_PATH"
      - name: ICK compile and object-only link owned Ike and receipt checker
        shell: /usr/bin/env grease {0}
        env:
          ICK_CC: ${{ steps.ick.outputs.compiler }}
        run: |
          set -o errexit -o nounset -o pipefail
          test "$(git -C ike-source rev-parse HEAD)" = a92fe68bf8aad8dfcfe9f7a7abd84e07290f7fe0
          mkdir -p .owned
          "$[ENV.ICK_CC]" -std=c11 -O2 -fPIC -Wall -Wextra -Werror -c ike-source/ike.c -o .owned/ike.o
          "$[ENV.HOST_LINKER]" .owned/ike.o -o .owned/ike
          "$[ENV.ICK_CC]" -std=c11 -O2 -fPIC -Wall -Wextra -Werror -c subpixel/receipt_check.c -o .owned/receipt.o
          "$[ENV.HOST_LINKER]" .owned/receipt.o -o .owned/receipt-check
      - name: Independent actual-source execution, sanitizers and 14 source mutants via Ike
        shell: /usr/bin/env grease {0}
        env:
          ICK_CC: ${{ steps.ick.outputs.compiler }}
          ICK_SOURCE_DIR: ${{ steps.ick.outputs.source }}
          GREASE_BINARY: ${{ steps.grease.outputs.executable }}
        run: |
          set -o errexit -o nounset -o pipefail
          var workspace = ENV.GITHUB_WORKSPACE
          cd "$workspace/framebuffer"
          mkdir -p build
          var identity = "sha256:$(sha256sum Ikefile | cut -d ' ' -f1)"
          var receipt = "$workspace/framebuffer/build/stack-ike.tsv"
          env -u IKE_RECIPE_RUNNER IKE_IKEFILE_IDENTITY="$identity" IKE_RECEIPT="$receipt" "$workspace/.owned/ike" accept | tee build/stack.log
          "$workspace/.owned/receipt-check" "$receipt" "$identity" accept '"$GREASE_BINARY" qualify-stack.grease'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: framebuffer-stack-independent
          path: |
            framebuffer/build
            ${{ steps.ick.outputs.receipt }}
            ${{ steps.grease.outputs.receipt }}
          if-no-files-found: error
