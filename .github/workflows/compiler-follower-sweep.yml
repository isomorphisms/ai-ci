name: compiler follower sweep

on:
  push:
    paths:
      - 'compiler-followers/**'
      - '.github/workflows/compiler-follower-sweep.yml'
  pull_request:
    paths:
      - 'compiler-followers/**'
      - '.github/workflows/compiler-follower-sweep.yml'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ARM/Thumb branch to inspect instead of main
        required: false
        default: main

permissions:
  contents: read

jobs:
  policy-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate follower policy
        shell: sh
        run: sh compiler-followers/validate-policy.sh compiler-followers/policy.tsv
      - name: Prove duplicate target is rejected
        shell: sh
        run: |
          if sh compiler-followers/validate-policy.sh compiler-followers/tests/bad-duplicate.tsv; then
            echo 'bad duplicate fixture was accepted' >&2
            exit 1
          fi
      - name: Validate reviewed ARM Thumb checkpoint
        shell: sh
        run: |
          checkpoint=$(tr -d '\r\n ' < compiler-followers/arm-thumb.checkpoint)
          printf '%s\n' "$checkpoint" | grep -Eq '^[0-9a-f]{40}$'

  arm-thumb-delta:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: policy-self-test
    runs-on: ubuntu-24.04
    env:
      REQUESTED_REF: ${{ inputs.upstream_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build follower sweep packet
        shell: sh
        run: |
          set -eu
          ref=${REQUESTED_REF:-main}
          remote=https://github.com/isomorphisms/idric-arm-thumb.git
          checkpoint=$(tr -d '\r\n ' < compiler-followers/arm-thumb.checkpoint)
          latest=$(git ls-remote --heads "$remote" "refs/heads/$ref" | awk 'NR == 1 { print $1 }')

          if [ -z "$latest" ]; then
            echo "ARM/Thumb ref not found: $ref" >&2
            exit 1
          fi

          {
            echo '## ARM/Thumb follower sweep'
            echo
            echo "- upstream ref: \`$ref\`"
            echo "- reviewed checkpoint: \`$checkpoint\`"
            echo "- current upstream: \`$latest\`"
            echo "- policy issue: isomorphisms/ai-ci#20"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$checkpoint" = "$latest" ]; then
            echo 'No unreviewed ARM/Thumb commits on this ref.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=ARM Thumb followers are stale::Reviewed checkpoint $checkpoint differs from $ref at $latest"
            work="$RUNNER_TEMP/idric-arm-thumb"
            git clone --quiet --filter=blob:none --no-checkout "$remote" "$work"
            git -C "$work" fetch --quiet origin "$ref"
            if ! git -C "$work" cat-file -e "$checkpoint^{commit}" 2>/dev/null; then
              git -C "$work" fetch --quiet origin "$checkpoint"
            fi

            echo '### Unreviewed ARM/Thumb delta' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if git -C "$work" merge-base --is-ancestor "$checkpoint" "$latest"; then
              git -C "$work" log --reverse --format='- `%h` %s' "$checkpoint..$latest" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- checkpoint is not an ancestor of the selected ref; inspect the ref relationship manually before propagation.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo
            echo '### Per-target mutatis-mutandis policy'
            echo
            echo '| target | ref | mode | ISA close | device close | scope |'
            echo '| --- | --- | --- | --- | --- | --- |'
            awk -F '\t' 'NR > 1 { printf "| %s | `%s` | `%s` | %s | %s | %s |\n", $1, $3, $4, $5, $6, $7 }' compiler-followers/policy.tsv
            echo
            echo 'The complete rule text is checked in at `compiler-followers/policy.tsv`. This job is read-only: it does not mutate followers or advance the checkpoint.'
          } >> "$GITHUB_STEP_SUMMARY"
