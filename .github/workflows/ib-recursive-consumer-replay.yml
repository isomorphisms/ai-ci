name: Independently replay the repaired recursive IB consumer
on:
  pull_request:
    paths:
      - '.github/workflows/ib-recursive-consumer-replay.yml'
      - 'ib-source/reader/LargeSourceObserver.smali'
      - 'ib-source/reader/SourceStackSampler.smali'
      - 'ib-source/reader/observe-large-source.grease'
      - 'ib-source/reader/prepare-recursive-replay.grease'
  workflow_dispatch:
concurrency:
  group: ib-recursive-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: checked large source API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared observation runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Verify the exact source-bound candidate archive
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-recursive-replay.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-recursive-replay" "${{ matrix.api }}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 150ae18dcac6e97e6bb5150e868929245f133594
          path: .tools/qualified-recursion-source
          persist-credentials: false
      - name: Install the declared literal verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Parse the maintained observer coordinator
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n ib-source/reader/observe-large-source.grease > "$RUNNER_TEMP/large-source.syntax.txt"
      - name: Prepare emulator KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Execute the unchanged real checked document preparation on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '${{ matrix.api }}'
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            .tools/runtime/.build/grease/bin/grease .tools/qualified-recursion-source/examples/autogenerated/runtime-recursion/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-recursive-replay/input/recursive-consumer" "$RUNNER_TEMP/ib-recursive-replay/recursive-controls"
            .tools/runtime/.build/grease/bin/grease ib-source/reader/observe-large-source.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-recursive-replay/input/recursive-consumer" "$RUNNER_TEMP/ib-recursive-replay/input/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-recursive-replay/large-source"
      - name: Retain exact source identity and actual bounded exception observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-recursive-consumer-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ib-recursive-replay/input-identity.tsv
            ${{ runner.temp }}/ib-recursive-replay/recursive-controls
            ${{ runner.temp }}/ib-recursive-replay/large-source
          if-no-files-found: warn
