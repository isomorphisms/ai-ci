name: Independently compare retained Flower metrics
on:
  pull_request:
    paths:
      - '.github/workflows/flower-retained-metric.yml'
      - 'examples/autogenerated/flower-retained-metric/**'
      - 'ick-host-objects/**'
      - 'ick-host/assignment-arrow.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-net:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphismes/flower
          ref: 133dbdf5b6edf5a9a98df47def4c08b923c0f6d2
          path: flower
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
      - name: Acquire qualified pinned ICK for Linux objects
        id: ick
        uses: ./ick-host-objects
      - name: Measure the source-bound material Net and verify both metrics
        env:
          ICK_CC: ${{ steps.ick.outputs.compiler }}
          AICI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/flower-oracle.ithon.jsonl
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$AICI_HEAD"
          test "$(git -C flower rev-parse HEAD)" = 133dbdf5b6edf5a9a98df47def4c08b923c0f6d2
          test "$(git -C ithon rev-parse HEAD)" = d6e83969f82512e920fb17b44326cb54f31d015c
          mkdir retained-output
          oracle=examples/autogenerated/flower-retained-metric
          for unit in flower flower_mesh flower_inspection; do
            "$ICK_CC" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC \
              -Iflower/src -c "flower/src/$unit.c" -o "retained-output/$unit.o"
          done
          "$ICK_CC" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC \
            -Iflower/src -c "$oracle/sample.c" -o retained-output/sample.o
          /usr/bin/x86_64-linux-gnu-gcc retained-output/*.o -lm -o retained-output/sample
          retained-output/sample > retained-output/observations.txt
          ithon/ithon "$oracle/check.pi" retained-output/observations.txt
          sha256sum retained-output/sample retained-output/observations.txt "$oracle/check.pi" > retained-output/digests.txt
          git rev-parse HEAD > retained-output/oracle-revision.txt
          git -C flower rev-parse HEAD > retained-output/leaf-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-net-metric-observations
          path: |
            retained-output/*.txt
            ${{ runner.temp }}/flower-oracle.ithon.jsonl
          if-no-files-found: error
