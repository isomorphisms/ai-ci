name: Retained priority and frontend system-mode admission
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-system-mode-readback.yml
      - examples/autogenerated/charcoal-system-mode-readback/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retained-getters:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        android:
          - api: 29
            priority: 13409510258
            frontends: '13409914784,13411445177,13410632873'
          - api: 34
            priority: 13408518491
            frontends: '13410767657,13410863309,13410189454'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ai-ci
          run-id: 42014570840
          artifact-ids: ${{ matrix.android.priority }}
          github-token: ${{ github.token }}
          path: retained-modes/priority
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ai-ci
          run-id: 42018946230
          artifact-ids: ${{ matrix.android.frontends }}
          github-token: ${{ github.token }}
          path: retained-modes/frontends
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Require all eight retained actual service-mode getter pairs
        run: grease/bin/grease examples/autogenerated/charcoal-system-mode-readback/read.grease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-system-mode-API${{ matrix.android.api }}
          path: system-mode-readback/
          if-no-files-found: warn
