name: Independent IB fb9b34a9 ChordReader SEARCH and decoding
on:
  pull_request:
    paths:
      - '.github/workflows/ib-installed-reader-replay.yml'
      - 'ib-source/**'
      - 'ingestion/src/fixture_server.c'
      - 'examples/autogenerated/ib-native-network/**'
  workflow_dispatch:
concurrency:
  group: ib-installed-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  installed:
    name: installed API ${{ matrix.api }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
            profile: decoding
          - api: 34
            target: google_apis
            profile: decoding
          - api: 29
            target: default
            profile: search
          - api: 34
            target: google_apis
            profile: search
    env:
      IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared observation runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the independent original-HTML link parser
        shell: sh
        run: make -f ick-host/Makefile extra-packages ICK_BUILD="$RUNNER_TEMP/ick-host-build" PACKAGES=libxml2-utils
      - name: Parse active independent reader orchestration before Android
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-google-continuation/parse-orchestration.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-orchestration"
      - name: Verify the exact source-bound candidate archive
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-installed-replay.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay"
      - name: Verify the exact qualified ChordReader APK input
        if: matrix.profile == 'search'
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-chord-handoff.grease "$RUNNER_TEMP/chord-search-input"
      - name: Install the independent observer's declared text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Execute the index oracle and corruption controls before Android
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/test-example-index.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/index-host"
      - name: Prepare emulator KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Independently observe the unchanged installed candidate navigation and original-byte decoding
        if: matrix.profile == 'decoding'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '${{ matrix.api }}'
          AICI_FIXTURE_ICK: ${{ steps.ick.outputs.compiler }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-installed.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input/native-client" "$RUNNER_TEMP/ib-installed-replay/input/oracles/smali.jar" "$ANDROID_HOME" "$RUNNER_TEMP/ib-installed-replay/input/platform-inputs/public-test-keystore" "$RUNNER_TEMP/ib-installed-replay/input/platform-inputs/shizuku-official.apk" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" reader-v2
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-navigation.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input" "$ANDROID_HOME" "$AICI_FIXTURE_ICK" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" "$RUNNER_TEMP/ib-installed-replay/navigation" reader-v4
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-encoding.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input" "$ANDROID_HOME" "$AICI_FIXTURE_ICK" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" "$RUNNER_TEMP/ib-installed-replay/navigation" "$RUNNER_TEMP/ib-installed-replay/encoding"
      - name: Observe actual ChordReader caller controls and SEARCH into the unchanged native reader
        if: matrix.profile == 'search'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '${{ matrix.api }}'
          AICI_FIXTURE_ICK: ${{ steps.ick.outputs.compiler }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-installed.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input/native-client" "$RUNNER_TEMP/ib-installed-replay/input/oracles/smali.jar" "$ANDROID_HOME" "$RUNNER_TEMP/ib-installed-replay/input/platform-inputs/public-test-keystore" "$RUNNER_TEMP/ib-installed-replay/input/platform-inputs/shizuku-official.apk" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" reader-v2
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-navigation.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input" "$ANDROID_HOME" "$AICI_FIXTURE_ICK" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" "$RUNNER_TEMP/ib-installed-replay/navigation" reader-v4
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-search-results.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-installed-replay/input" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-installed-replay/observed" "$RUNNER_TEMP/ib-installed-replay/navigation" "$RUNNER_TEMP/chord-search-input" "$RUNNER_TEMP/ib-installed-replay/search"
      - name: Retain independent identity, status, source and installed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-fb9-installed-api${{ matrix.api }}-${{ matrix.profile }}-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ib-orchestration
            ${{ runner.temp }}/ib-installed-replay/input-identity.tsv
            ${{ runner.temp }}/ib-installed-replay/observer-commit.txt
            ${{ runner.temp }}/ib-installed-replay/candidate-sha256.txt
            ${{ runner.temp }}/ib-installed-replay/observed/*.txt
            ${{ runner.temp }}/ib-installed-replay/observed/*.png
            ${{ runner.temp }}/ib-installed-replay/observed/*.xml
            ${{ runner.temp }}/ib-installed-replay/observed/*.tsv
            ${{ runner.temp }}/ib-installed-replay/observed/*.failure-source.tar.gz
            ${{ runner.temp }}/ib-installed-replay/observed/*.exit
            ${{ runner.temp }}/ib-installed-replay/navigation
            ${{ runner.temp }}/ib-installed-replay/encoding
            ${{ runner.temp }}/ib-installed-replay/search
            ${{ runner.temp }}/chord-search-input/input-identity.tsv
            ${{ runner.temp }}/ib-installed-replay/index-host
          if-no-files-found: warn
