name: GitHub runner policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-policy:
    name: ${{ github.event_name == 'pull_request' && 'runner-policy' || format('runner-policy-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove policy fixtures reject drift
        shell: sh
        run: sh tests/github.sh
      - name: Enforce policy on this repository
        uses: ./github
        with:
          root: .
          exceptions: .github/aici-runner-exceptions.tsv
          visibility: public
