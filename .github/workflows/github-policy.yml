name: GitHub runner policy

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/aici-runner-exceptions.tsv'
      - 'github/**'
      - 'src/aici_github.c'
      - 'tests/github.sh'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/aici-runner-exceptions.tsv'
      - 'github/**'
      - 'src/aici_github.c'
      - 'tests/github.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove policy fixtures reject drift
        shell: sh
        run: sh tests/github.sh
      - name: Enforce policy on this repository
        uses: ./github
        with:
          root: .
          exceptions: .github/aici-runner-exceptions.tsv
          visibility: public
