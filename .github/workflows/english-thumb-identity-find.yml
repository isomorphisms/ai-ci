name: Check Task 12 lookup and deletion under independent ARM callers
on:
  pull_request:
    paths:
      - 'english-major-c/identity-find/**'
      - 'english-major-c/identity-destroy/**'
      - 'english-major-c/verify-task12.mjs'
      - 'ci/build-toolchain.tsv'
      - '.github/workflows/english-thumb-identity-find.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - operation: identity-find
            job_name: lookup
            artifact: emc-task12-qemu-caller
            revision: ce52cf665e302588a6334d4efa4e495da40bab5b
          - operation: identity-destroy
            job_name: deletion
            artifact: emc-task12-qemu-deletion
            revision: 5548fed6fa936b1f80d7a16bb9299acda6b05523
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/English-major-C
          ref: ${{ matrix.revision }}
          path: consumer
          persist-credentials: false
      - name: Install QEMU user mode and select NDK r27c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          if ! test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
          fi
          qemu-arm --version
      - name: Run producer frontend, ARM caller and negative controls
        run: |
          node english-major-c/${{ matrix.operation }}/verify.mjs "$GITHUB_WORKSPACE/consumer" \
            "$ANDROID_HOME/ndk/27.2.12479018" qemu-arm "$RUNNER_TEMP/identity-check"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/identity-check/
