name: Check Task 12 identity lookup under an independent ARM caller
on:
  pull_request:
    paths:
      - 'english-major-c/identity-find/**'
      - 'ci/build-toolchain.tsv'
      - '.github/workflows/english-thumb-identity-find.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/English-major-C
          ref: ce52cf665e302588a6334d4efa4e495da40bab5b
          path: consumer
          persist-credentials: false
      - name: Install QEMU user mode and select NDK r27c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          if ! test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
          fi
          qemu-arm --version
      - name: Run producer frontend, ARM caller and negative controls
        run: |
          node english-major-c/identity-find/verify.mjs "$GITHUB_WORKSPACE/consumer" \
            "$ANDROID_HOME/ndk/27.2.12479018" qemu-arm "$RUNNER_TEMP/identity-check"
      - uses: actions/upload-artifact@v4
        with:
          name: emc-task12-qemu-caller
          path: ${{ runner.temp }}/identity-check/
