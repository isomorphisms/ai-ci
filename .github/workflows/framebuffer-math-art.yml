name: Framebuffer mathematical art independent acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framebuffer-math-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ICK_CC: ${{ github.workspace }}/_ick/stage/bin/x86_64-linux-gnu-gcc
      ICK_SOURCE_DIR: ${{ github.workspace }}/_ick
      HOST_LINKER: /usr/bin/x86_64-linux-gnu-gcc
    steps:
      - name: Check out exact ai-ci head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact framebuffer source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/rough.framebuffer
          ref: def88c79cb8ee4d9ce867582c000e564be72c272
          path: _fb
          persist-credentials: false
      - name: Acquire exact owned ICK compiler source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ick
          ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
          path: _ick
          submodules: true
          persist-credentials: false
      - name: Bootstrap owned ICK stage-zero from its pinned GCC reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _ick rev-parse HEAD)" = c61e448251744a2f40ad743ebef1a027bdcd2f9d
          test "$(git -C _ick/gcc rev-parse HEAD)" = 6294f1d9e7536e5ffcde09d1528c918d63abfef5
          grep -Fxq 'gcc_commit=6294f1d9e7536e5ffcde09d1528c918d63abfef5' _ick/ick/SOURCE.lock
          sudo apt-get update
          sudo apt-get install -y build-essential flex texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev binutils
          cd _ick
          sh ick/materialize.sh gcc source
          mkdir -p build stage
          cd build
          ../source/configure --target=x86_64-linux-gnu --prefix="$GITHUB_WORKSPACE/_ick/stage" \
            --with-as="$(command -v x86_64-linux-gnu-as)" \
            --with-ld="$(command -v x86_64-linux-gnu-ld)" \
            --enable-languages=c --disable-bootstrap --disable-multilib \
            --disable-nls --disable-shared --disable-threads \
            --without-headers --disable-libatomic --disable-libgomp \
            --disable-libquadmath --disable-libssp --disable-libvtv
          /usr/bin/make -j2 all-gcc
          /usr/bin/make install-gcc
          test -x "$ICK_CC"
          "$ICK_CC" -dumpmachine | grep -Fx x86_64-linux-gnu
      - name: Require source identity and build independent checker
        shell: sh
        run: |
          set -eu
          test "$(git -C _fb rev-parse HEAD)" = def88c79cb8ee4d9ce867582c000e564be72c272
          mkdir -p "$RUNNER_TEMP/framebuffer-accept"
          sh framebuffer/build-ick.sh "$RUNNER_TEMP/framebuffer-accept/rough-surface" _fb/src/surface_main.c _fb/src/surface.c
          sh framebuffer/build-ick.sh "$RUNNER_TEMP/framebuffer-accept/rough-fb" _fb/src/main.c _fb/src/framebuffer.c
          sh framebuffer/build-ick.sh "$RUNNER_TEMP/framebuffer-accept/verify" framebuffer/verify_surfaces.c _fb/src/framebuffer.c
          sha256sum "$RUNNER_TEMP/framebuffer-accept/rough-surface" "$RUNNER_TEMP/framebuffer-accept/rough-fb" "$RUNNER_TEMP/framebuffer-accept/verify"
      - name: Render all five scenes through real native source and rasterizer
        shell: sh
        run: |
          set -eu
          d="$RUNNER_TEMP/framebuffer-accept"
          "$d/rough-surface" torus 0 160 160 > "$d/torus0.ops"
          "$d/rough-surface" torus 360 160 160 > "$d/torus360.ops"
          "$d/rough-surface" torus 37 160 160 > "$d/torus37.ops"
          "$d/rough-surface" enneper 25 160 160 > "$d/enneper25.ops"
          "$d/rough-surface" torus 30 160 160 0.55 > "$d/near.ops"
          "$d/rough-fb" "$d/torus0.ops" "$d/torus0.ppm" 160 160
          "$d/rough-fb" "$d/torus37.ops" "$d/torus37.ppm" 160 160
          "$d/rough-fb" "$d/enneper25.ops" "$d/enneper25.ppm" 160 160
          sha256sum "$d"/*.ops "$d"/*.ppm
      - name: Independent semantics and framebuffer pixel acceptance
        shell: sh
        run: |
          set -eu
          d="$RUNNER_TEMP/framebuffer-accept"
          "$d/verify" "$d/torus0.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm"
      - name: Kill seam, projection, occlusion, static-frame, missing-clip and fake-frame mutants
        shell: sh
        run: |
          set -eu
          d="$RUNNER_TEMP/framebuffer-accept"
          sed -e 's/sin(u)/sin(1.3 * u)/' -e 's/cos(2.0 \* v)/cos(1.8 * v)/' _fb/src/surface.c > "$d/bad-palette.c"
          grep -q 'sin(1.3 \* u)' "$d/bad-palette.c"
          sh framebuffer/build-ick.sh "$d/bad-palette" _fb/src/surface_main.c "$d/bad-palette.c"
          "$d/bad-palette" torus 0 160 160 > "$d/bad-palette.ops"
          if "$d/verify" "$d/bad-palette.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL TORUS_PALETTE_SEAM' "$d/mutant.log"

          sed 's/0.5 + focal \* p.x/0.5 - focal * p.x/' _fb/src/surface.c > "$d/bad-camera.c"
          grep -q '0.5 - focal \* p.x' "$d/bad-camera.c"
          sh framebuffer/build-ick.sh "$d/bad-camera" _fb/src/surface_main.c "$d/bad-camera.c"
          "$d/bad-camera" torus 0 160 160 > "$d/bad-camera.ops"
          if "$d/verify" "$d/bad-camera.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL ANALYTIC_TORUS_PROJECTION' "$d/mutant.log"

          sed 's/fragment_depth < (double)fb->depth\[depth_index\]/fragment_depth > (double)fb->depth[depth_index]/' _fb/src/framebuffer.c > "$d/bad-depth.c"
          grep -q 'fragment_depth > (double)fb->depth\[depth_index\]' "$d/bad-depth.c"
          sh framebuffer/build-ick.sh "$d/bad-depth" framebuffer/verify_surfaces.c "$d/bad-depth.c"
          if "$d/bad-depth" "$d/torus0.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL FAR_TRIANGLE_MISSING' "$d/mutant.log"

          if "$d/verify" "$d/torus0.ops" "$d/torus360.ops" "$d/torus0.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL ANGLE_DID_NOT_CHANGE_GEOMETRY' "$d/mutant.log"
          if "$d/verify" "$d/torus0.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/torus0.ops" "$d/torus0.ppm" "$d/torus37.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL NEAR_PLANE_NOT_CLIPPED' "$d/mutant.log"
          if "$d/verify" "$d/torus0.ops" "$d/torus360.ops" "$d/torus37.ops" "$d/enneper25.ops" "$d/near.ops" "$d/torus0.ppm" "$d/torus0.ppm" "$d/enneper25.ppm" > "$d/mutant.log" 2>&1; then exit 1; fi
          grep -q 'FAIL FRAME_NOT_RENDERED_FROM_OPERATIONS' "$d/mutant.log"
          echo 'MUTANT_REJECTION_PASS: 6 incorrect implementations/artifacts rejected at intended oracles'
