name: Pasteboard current listener readiness and unchanged controls
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-pasteboard-readiness.yml
      - pasteboard/observe-controls.grease
      - pasteboard/require-listener-ready.grease
      - examples/autogenerated/pasteboard-listener-readiness/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35]
    env:
      ASAN_OPTIONS: detect_leaks=0
      GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          ref: ae857b6178c1a8e3a7887574122fa3d9661eeb0e
          path: producer
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13404523390
          merge-multiple: true
          github-token: ${{ github.token }}
          path: producer/downloaded-apks
      - run: echo 'a22e6e27ebb08277fd746c232caf81fa19495426780992dd398f40f688b91b13  producer/downloaded-apks/pasteboard-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13403854796
          merge-multiple: true
          github-token: ${{ github.token }}
          path: producer/build/pasteboard-independent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13404553446
          merge-multiple: true
          github-token: ${{ github.token }}
          path: producer/downloaded-evidence
      - name: Retrieve the oracle's exact retained producer runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13404144364
          merge-multiple: true
          github-token: ${{ github.token }}
          path: retained-runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Require current-process, installed-owner and current-epoch readiness controls
        run: '"$GREASE" examples/autogenerated/pasteboard-listener-readiness/qualify.grease "$GITHUB_WORKSPACE" "$GREASE" "$RUNNER_TEMP/listener-readiness-parser"'
      - name: Restore exact compiled oracle and stage the source-bound controller
        run: '"$GREASE" examples/autogenerated/pasteboard-listener-readiness/restore.grease "$GITHUB_WORKSPACE"'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$GREASE" pasteboard/run-suite.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ matrix.api }}" workflow "$GITHUB_WORKSPACE/producer"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pasteboard-current-listener-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/listener-readiness-parser/
            producer/build/emulator-evidence/
            producer/build/art-evidence/
            producer/build/clipboard-evidence/
            producer/build/control-evidence/
            producer/build/ui-evidence/
            producer/build/runtime-restoration/
          if-no-files-found: warn
