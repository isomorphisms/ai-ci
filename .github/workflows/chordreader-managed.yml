name: Independent ChordReader managed ART qualification
on:
  pull_request:
    paths:
      - 'chordreader-managed/**'
      - '.github/workflows/chordreader-managed.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      PRODUCER_SHA: e6c84d645ad7086a11ae2735258188a49e444d13
      PRODUCER_RUN: '41347983217'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/tablature
          ref: ${{ env.PRODUCER_SHA }}
          path: .tools/producer
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13100269370
          repository: dilapidated-shed/tablature
          run-id: ${{ env.PRODUCER_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .tools/producer-artifacts
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fuego-ironworks/idric-arm-thumb
          ref: c13a6a223a24c211d090d2c88a395c134ed8d469
          path: .tools/dex
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 6e1c9619a96f28494ad891a32a06edfb72f3e25b
          path: .tools/android-NDK
          persist-credentials: false
      - name: Qualify the compiler for the maintained Grease bootstrap
        id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build and smoke-test pinned Grease through its maintained bootstrap
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Recover the already qualified compiler cache identity
        id: qualified_ick_cache
        run: .tools/runtime/.build/grease/bin/grease .tools/android-NDK/dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the qualified compiler before consumer observation
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Install declared independent observer text tools
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep jq'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;36.0.0'
      - name: Verify exact producer, signatures, packaged DEX and observer syntax
        run: .tools/runtime/.build/grease/bin/grease chordreader-managed/prepare.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/producer" "$GITHUB_WORKSPACE/.tools/producer-artifacts" "$PRODUCER_SHA" "$PRODUCER_RUN" "$RUNNER_TEMP/chordreader-inputs"
      - name: Parse the maintained observation coordinator
        run: .tools/runtime/.build/grease/bin/grease -n chordreader-managed/observe.grease
      - name: Prepare emulator acceleration
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Execute independent positive and compiled-mutant controls on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease chordreader-managed/observe.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/producer-artifacts" "$GITHUB_WORKSPACE/.tools/dex/build/oracles/smali-3.0.10.jar" "$GITHUB_WORKSPACE/.tools/dex/build/oracles/baksmali-3.0.10.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ matrix.api }}" "$RUNNER_TEMP/chordreader-api${{ matrix.api }}"
      - name: Retain independent exact-artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chordreader-independent-api${{ matrix.api }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chordreader-inputs/
            ${{ runner.temp }}/chordreader-api${{ matrix.api }}/
