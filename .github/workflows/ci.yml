name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check library syntax
        run: node --check src/ai-ci.mjs

      - name: Check command syntax
        run: node --check bin/ai-ci.mjs

      - name: Check action syntax
        run: node --check action/index.mjs

      - name: Run escaped-defect regressions
        run: node --test
