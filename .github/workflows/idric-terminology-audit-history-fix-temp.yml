name: Temporary Idriç audit-history terminology repair

on:
  push:
    branches:
      - docs/idric-terminology-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/idric-terminology-audit
          fetch-depth: 0

      - name: Correct maintained audit-history prose
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/audits/2026-09-05--12-execution.md')
          text = path.read_text()
          replacements = [
              ('failed against Idric `3b91550…`', 'failed against Idriç `3b91550…`'),
              ('[Idric STYLE rule](', '[Idriç STYLE rule]('),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name 'isomorphisms terminology audit'
          git config user.email 'isomorphisms@users.noreply.github.com'
          git add docs/audits/2026-09-05--12-execution.md
          git diff --cached --check
          git commit -m 'Normalize Idriç terminology in audit history'
          git push origin HEAD:docs/idric-terminology-audit
