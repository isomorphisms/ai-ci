name: Independent Google original-body result semantics
on:
  pull_request:
    paths:
      - '.github/workflows/google-result-classification.yml'
      - 'ib-source/reader/classify-google.grease'
      - 'ib-source/reader/test-google-classification.grease'
      - 'examples/autogenerated/google-result-classification/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build declared Grease runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the independent HTML parser
        shell: sh
        run: make -f ick-host/Makefile extra-packages ICK_BUILD="$RUNNER_TEMP/ick-host-build" PACKAGES='libxml2-utils ripgrep'
      - name: Require positives and targeted semantic refusals
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/test-google-classification.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/runtime/.build/grease/bin/grease" "$RUNNER_TEMP/google-classification"
      - name: Retain exact observation and control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Google-body-classification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/google-classification
          if-no-files-found: warn
