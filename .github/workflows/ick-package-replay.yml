name: ICK archive acquisition and independent host replay

on:
  pull_request:
    paths:
      - 'examples/autogenerated/ick-package-replay/**'
      - 'package-closure/**'
      - 'ick-host/assignment-arrow.c'
      - '.github/workflows/ick-package-replay.yml'
  push:
    branches: [main]
    paths:
      - 'examples/autogenerated/ick-package-replay/**'
      - 'package-closure/**'
      - 'ick-host/assignment-arrow.c'
      - '.github/workflows/ick-package-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  archive-replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact checked Ithon frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: _ithon
          persist-credentials: false
      - name: Exercise archive positives and targeted refusals
        shell: sh
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/check.pi
      - name: Acquire the existing compiler artifact without rebuilding it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11610372892'
          run-id: '37916479044'
          repository: isomorphisms/ai-ci
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _archive
      - name: Check out immutable real Fourier Voice source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/Fourier-sound
          ref: a71c9d37f47154ba7b66d7c0d5c912477c71f23c
          path: _consumer
          sparse-checkout: fourier/ick_polynomial_leaf.c
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify source-bound archive and acquire complete delivered material
        shell: sh
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ick-acquisition-frontend.jsonl
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/package_replay.pi acquire "$GITHUB_WORKSPACE/_archive/ick-android-armeabi-v7a-stage.tar.gz" 5e2ed617ce2f9dae4c7330a52bed4c99f87089516b716cffa76cca928a8c9aab "$RUNNER_TEMP/relocated ICK stage"
      - name: Replay the delivered compiler from an unrelated directory
        shell: sh
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ick-replay-frontend.jsonl
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/package_replay.pi replay "$RUNNER_TEMP/relocated ICK stage" "$GITHUB_WORKSPACE/_consumer/fourier/ick_polynomial_leaf.c" 0b55650f8492acbb86f12740980cf539b24bbcc56d477d2d5e4faaf2e463ac93 "$GITHUB_WORKSPACE/ick-host/assignment-arrow.c" "$RUNNER_TEMP/independent ICK replay"
      - name: Retain bounded host observations and canonical material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ick-archive-host-replay
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/relocated ICK stage/material.tsv
            ${{ runner.temp }}/independent ICK replay
            ${{ runner.temp }}/ick-acquisition-frontend.jsonl
            ${{ runner.temp }}/ick-replay-frontend.jsonl
