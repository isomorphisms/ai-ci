name: ICK archive acquisition and independent host replay

on:
  pull_request:
    paths:
      - 'examples/autogenerated/ick-package-replay/**'
      - 'package-closure/**'
      - 'examples/autogenerated/source-admission/SourceProcess.idric'
      - 'ick-host/assignment-arrow.c'
      - '.github/workflows/ick-package-replay.yml'
  push:
    branches: [main]
    paths:
      - 'examples/autogenerated/ick-package-replay/**'
      - 'package-closure/**'
      - 'examples/autogenerated/source-admission/SourceProcess.idric'
      - 'ick-host/assignment-arrow.c'
      - '.github/workflows/ick-package-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  archive-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned Idriç compiler for independent material admission
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: 2bce7677f513d711875e978bd6f5ad28b9e54d58
          path: _package-idric
          persist-credentials: false
      - name: Qualify ICK for the compiler owner's support code
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Bootstrap pinned Idriç through its maintained Chez lane
        working-directory: _package-idric
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./_/edric all
      - name: Check the maintained escaped process module
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_package-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_package-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_package-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_package-idric/_/libs/base/build/ttc
        run: '"${{ github.workspace }}/_package-idric/_/build/exec/idris2" --no-banner --no-color --source-dir "$GITHUB_WORKSPACE/examples/autogenerated/source-admission" --build-dir "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/build" --check "$GITHUB_WORKSPACE/examples/autogenerated/source-admission/SourceProcess.idric"'
      - name: Compile independent Idriç material observer
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_package-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_package-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_package-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_package-idric/_/libs/base/build/ttc:${{ github.workspace }}/examples/autogenerated/ick-package-replay/build/ttc
        run: '"${{ github.workspace }}/_package-idric/_/build/exec/idris2" --no-banner --no-color --source-dir "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay" --build-dir "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/build" -o material-admission "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/MaterialAdmission.idric"'
      - name: Compile independently constructed material fixtures
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_package-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_package-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_package-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_package-idric/_/libs/base/build/ttc:${{ github.workspace }}/examples/autogenerated/ick-package-replay/build/ttc
        run: '"${{ github.workspace }}/_package-idric/_/build/exec/idris2" --no-banner --no-color --source-dir "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay" --build-dir "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/build" -o material-admission-fixtures "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/MaterialAdmissionFixtures.idric"'
      - name: Execute independent corrupt and benign material controls
        shell: sh
        run: 'examples/autogenerated/ick-package-replay/build/exec/material-admission-fixtures "${{ github.workspace }}/examples/autogenerated/ick-package-replay/build/exec/material-admission" "${{ runner.temp }}/package-fixtures"'
      - name: Check out exact checked Ithon frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: _ithon
          persist-credentials: false
      - name: Exercise archive positives and targeted refusals
        shell: sh
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/check.pi
      - name: Acquire the existing compiler artifact without rebuilding it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11610372892'
          run-id: '37916479044'
          repository: isomorphisms/ai-ci
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _archive
      - name: Check out immutable real Fourier Voice source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/Fourier-sound
          ref: a71c9d37f47154ba7b66d7c0d5c912477c71f23c
          path: _consumer
          sparse-checkout: fourier/ick_polynomial_leaf.c
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Acquire the partial native Grease implementation for scoped checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14083485063'
          run-id: '43520333267'
          repository: dilapidated-shed/oils
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _grease-partial
      - name: Check exact native Grease bytes
        shell: sh
        run: 'echo "5991182c9540a8bba58c12bf15965db033b6bcbb59b30f85a8c44000b697382c  _grease-partial/ysh-d" | sha256sum --check --strict'
      - name: Set executable mode on artifact transport
        shell: sh
        run: chmod 755 _grease-partial/ysh-d
      - name: Execute unchanged shared Grease controls under the partial runtime
        shell: sh
        run: 'timeout 30 _grease-partial/ysh-d package-closure/self-test.grease "$GITHUB_WORKSPACE/package-closure" "$GITHUB_WORKSPACE/_grease-partial/ysh-d" "$RUNNER_TEMP/grease-material-controls"'
      - name: Verify source-bound archive and acquire complete delivered material
        shell: sh
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ick-acquisition-frontend.jsonl
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/package_replay.pi acquire "$GITHUB_WORKSPACE/_archive/ick-android-armeabi-v7a-stage.tar.gz" 5e2ed617ce2f9dae4c7330a52bed4c99f87089516b716cffa76cca928a8c9aab "$RUNNER_TEMP/relocated ICK stage"
      - name: Independently admit all delivered material before execution
        shell: sh
        run: 'examples/autogenerated/ick-package-replay/build/exec/material-admission "$RUNNER_TEMP/relocated ICK stage" 62661fb117fc5b36dd2ffc280f44e9eae3d1b6c88863de6aac547b6fd9b34459 "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/required-ick.tsv"'
      - name: Exercise unchanged Grease verifier on actual compiler material
        shell: sh
        run: 'timeout 60 _grease-partial/ysh-d package-closure/verify.grease "$RUNNER_TEMP/relocated ICK stage" "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/required-modes.tsv" "$GITHUB_WORKSPACE/package-closure/manifest.grease" "$GITHUB_WORKSPACE/_grease-partial/ysh-d" "$RUNNER_TEMP/grease-observed-material.tsv"'
      - name: Replay the delivered compiler from an unrelated directory
        shell: sh
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ick-replay-frontend.jsonl
        run: exec _ithon/ithon examples/autogenerated/ick-package-replay/package_replay.pi replay "$RUNNER_TEMP/relocated ICK stage" "$GITHUB_WORKSPACE/_consumer/fourier/ick_polynomial_leaf.c" 0b55650f8492acbb86f12740980cf539b24bbcc56d477d2d5e4faaf2e463ac93 "$GITHUB_WORKSPACE/ick-host/assignment-arrow.c" "$RUNNER_TEMP/independent ICK replay"
      - name: Prove execution preserved all delivered bytes and modes
        shell: sh
        run: 'examples/autogenerated/ick-package-replay/build/exec/material-admission "$RUNNER_TEMP/relocated ICK stage" 62661fb117fc5b36dd2ffc280f44e9eae3d1b6c88863de6aac547b6fd9b34459 "$GITHUB_WORKSPACE/examples/autogenerated/ick-package-replay/required-ick.tsv"'
      - name: Retain bounded host observations and canonical material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ick-archive-host-replay
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/relocated ICK stage/material.tsv
            ${{ runner.temp }}/independent ICK replay
            ${{ runner.temp }}/ick-acquisition-frontend.jsonl
            ${{ runner.temp }}/ick-replay-frontend.jsonl
            ${{ runner.temp }}/package-fixtures/*.tsv
            ${{ runner.temp }}/grease-observed-material.tsv
