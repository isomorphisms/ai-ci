name: Independent scientific charcoal controls
on:
  pull_request:
    paths:
      - charcoal/observe-holomorphic.grease
      - .github/workflows/charcoal-scientific.yml
      - examples/autogenerated/charcoal-control-sampler/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphismes/holomorphic
          run-id: 41977273427
          artifact-ids: 13394618740
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
      - run: echo '9818cfe24da9038a3aab961a31c8af23b0954d7077752f8aa1be04a1e9f2f308  candidate/android/app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: >
            "$CHARCOAL_GREASE" charcoal/observe-holomorphic.grease "$ANDROID_HOME/platform-tools/adb"
            emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/android/app/build/outputs/apk/debug/app-debug.apk"
            "$CHARCOAL_GREASE" "$RUNNER_TEMP/holomorphic-charcoal" "${{ matrix.api }}"
            463584e2e8dd6de9114701f49ca9d78baf8710a4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scientific-charcoal-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/holomorphic-charcoal
          if-no-files-found: warn
