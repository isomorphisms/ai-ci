name: Independent ART replay of IB 513d72cb checkpoint
on:
  pull_request:
    paths:
      - 'ib-source/reader/**'
      - '.github/workflows/ib-reader-art-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ib-reader-replay-${{ github.event.pull_request.number || github.ref }}
  # This replays one frozen IB checkpoint. Updating an unrelated observer must
  # not repeatedly cancel its independent compiler/bootstrap qualification.
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 513d72cb43d3097a61f6fcb821b6e4215def960f
          path: .tools/ib-source
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared observation runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Verify source-bound checkpoint and reject changed archive bytes
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-replay.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-checkpoint"
      - name: Execute checked candidates and compiled controls on actual ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease ib-source/reader/observe-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-checkpoint/input" "$RUNNER_TEMP/ib-checkpoint/input/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/ib-checkpoint/observed"
      - name: Retain exact checkpoint and independent observation identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-513d72cb-api${{ matrix.api }}-observer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ib-checkpoint/observed
            ${{ runner.temp }}/ib-checkpoint/input-identity.tsv
            ${{ runner.temp }}/ib-checkpoint/archive-control.txt
          if-no-files-found: warn
