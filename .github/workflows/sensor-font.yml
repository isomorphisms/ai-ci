name: Independent continuous sensor-font acceptance
on:
  pull_request:
    paths: ['subpixel/sensor_font_verify.c', 'subpixel/sensor-font/**', '.github/workflows/sensor-font.yml']
permissions:
  contents: read
jobs:
  sensor-font:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/rough.framebuffer
          ref: 83ea1bf4989a8857b9d70c9ae238aa9e0932bf0e
          path: producer
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Compile independent oracle and actual producer with ICK
        run: |
          mkdir -p sensor-font-results
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic -O2 -std=c11 -Wall -Wextra -Werror -pedantic -ffp-contract=off -fno-fast-math -Iproducer/subpixel/include subpixel/sensor_font_verify.c producer/subpixel/src/font.c producer/subpixel/examples/font_5x7.c producer/subpixel/src/path.c producer/subpixel/src/coverage_plane.c producer/subpixel/src/curve_patch.c producer/subpixel/src/curve_patch_5x5.c -lm -o sensor-font-results/verify
          git rev-parse HEAD > sensor-font-results/oracle-source.txt
          git -C producer rev-parse HEAD > sensor-font-results/producer-source.txt
          sha256sum "${{ steps.ick.outputs.compiler }}" sensor-font-results/verify subpixel/sensor_font_verify.c > sensor-font-results/materials.sha256
      - name: Accept actual continuous strokes and sampled contour topology
        run: |
          sensor-font-results/verify sensor-font-results/slash-before-after.pgm > sensor-font-results/positive.tsv
          grep -Fq 'SENSOR_FONT_ACCEPT 100 independent line-union cases and 32 sampled contour cases: PASS' sensor-font-results/positive.tsv
          grep -Eq '^application_scale_cases[[:space:]]710[[:space:]]PASS$' sensor-font-results/positive.tsv
      - name: Reject historical bumpy slash control
        run: |
          if sensor-font-results/verify --old-slash > sensor-font-results/negative.tsv 2> sensor-font-results/negative-errors.txt; then
            echo 'Historical bitmap reconstruction was incorrectly accepted' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          grep -Fq 'SENSOR_FONT_REJECT exact finite-segment union U+002f' sensor-font-results/negative-errors.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sensor-font-independent-results
          path: sensor-font-results/
          if-no-files-found: error
