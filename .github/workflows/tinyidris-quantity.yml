name: TinyIdris quantity receipt

on:
  pull_request:
    paths:
      - evals/tinyidris_quantity.sh
      - .github/workflows/tinyidris-quantity.yml
  push:
    branches:
      - main
    paths:
      - evals/tinyidris_quantity.sh
      - .github/workflows/tinyidris-quantity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-idric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: Idriç
          path: _idric
      - name: Install compiler build tools
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl
      - name: Build current Idriç compiler
        shell: sh
        run: _idric/_/edric bootstrap
      - name: Emit TinyIdris quantity receipt
        shell: bash
        run: |
          set -o pipefail
          compiler_revision=$(git -C _idric rev-parse HEAD)
          export CHEZ="$PWD/_idric/_/.tools/bin/scheme"
          export PATH="$PWD/_idric/_/.tools/bin:$PATH"
          export IDRIS2_PATH="$PWD/_idric/_/libs/prelude/build/ttc:$PWD/_idric/_/libs/base/build/ttc:$PWD/_idric/_/libs/linear/build/ttc:$PWD/_idric/_/libs/network/build/ttc:$PWD/_idric/_/libs/contrib/build/ttc:$PWD/_idric/_/libs/test/build/ttc"
          sh evals/tinyidris_quantity.sh \
            "$PWD/_idric/_/build/exec/idris2" \
            "$compiler_revision" \
            | tee tinyidris-quantity-receipt.tsv
      - name: Retain TinyIdris quantity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyidris-quantity-receipt
          path: tinyidris-quantity-receipt.tsv
          if-no-files-found: warn
