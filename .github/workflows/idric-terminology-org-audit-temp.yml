name: Temporary Idriç terminology organization audit

on:
  push:
    branches:
      - audit/idric-terminology-org-scan

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scan refreshed default branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          owner = "isomorphisms"
          token = os.environ.get("GH_TOKEN", "")
          candidate = re.compile(r"\b(?:edric|edriç|idric)\b", re.IGNORECASE)
          full_scan_forks = {"Idric"}
          text_suffixes = {
              ".md", ".markdown", ".txt", ".rst", ".adoc", ".yml", ".yaml",
              ".sh", ".bash", ".zsh", ".fish", ".c", ".h", ".cc", ".cpp",
              ".hpp", ".java", ".kt", ".kts", ".py", ".rb", ".go", ".rs",
              ".hs", ".lhs", ".idr", ".idric", ".grease", ".ysh", ".js",
              ".jsx", ".ts", ".tsx", ".xml", ".toml", ".ini", ".cfg", ".conf",
              ".ipkg", ".mk", ".gradle", ".properties", ".sql", ".s", ".asm",
              ".ld", ".html", ".css", ".tex", ".org", ".csv", ".tsv",
          }
          exact_text_names = {
              "Makefile", "Dockerfile", "Containerfile", "AGENTS.md", "STYLE.md",
              "README", "LICENSE", "UPSTREAM", "NOTICE",
          }

          def request_json(url):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "idric-terminology-audit"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def request_text(url):
              req = urllib.request.Request(url, headers={"User-Agent": "idric-terminology-audit"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
              if b"\0" in data[:8192]:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          def is_text_candidate(path):
              name = path.rsplit("/", 1)[-1]
              lower = name.lower()
              if name in exact_text_names:
                  return True
              if lower.startswith("readme") or lower.startswith("agents") or lower.startswith("style"):
                  return True
              dot = lower.rfind(".")
              return dot >= 0 and lower[dot:] in text_suffixes

          def fork_overlay_candidate(path):
              name = path.rsplit("/", 1)[-1].lower()
              depth = path.count("/")
              return (
                  name == "agents.md"
                  or name == "style.md"
                  or path.startswith(".github/")
                  or (depth == 0 and (name.startswith("readme") or name.endswith(".md")))
              )

          repos = []
          for page in range(1, 4):
              url = f"https://api.github.com/users/{owner}/repos?type=owner&sort=full_name&per_page=100&page={page}"
              batch = request_json(url)
              repos.extend(batch)
              if len(batch) < 100:
                  break

          print(f"REPOSITORY_COUNT\t{len(repos)}")
          totals = {"files": 0, "scanned": 0, "matches": 0, "large": 0, "binary": 0, "errors": 0, "fork_upstream_skipped": 0}

          for repo in sorted(repos, key=lambda r: r["name"].lower()):
              name = repo["name"]
              default = repo["default_branch"]
              is_fork = bool(repo.get("fork"))
              mode = "full" if (not is_fork or name in full_scan_forks) else "fork-overlay"
              branch_q = urllib.parse.quote(default, safe="")
              tree_url = f"https://api.github.com/repos/{owner}/{urllib.parse.quote(name, safe='')}/git/trees/{branch_q}?recursive=1"
              try:
                  tree = request_json(tree_url)
              except Exception as exc:
                  print(f"INCOMPLETE\t{name}\t{default}\ttree_error\t{type(exc).__name__}:{exc}")
                  totals["errors"] += 1
                  continue
              if tree.get("truncated"):
                  print(f"INCOMPLETE\t{name}\t{default}\ttree_truncated")
                  totals["errors"] += 1

              blobs = [item for item in tree.get("tree", []) if item.get("type") == "blob"]
              totals["files"] += len(blobs)
              chosen = []
              fork_skipped = 0
              large = 0
              for item in blobs:
                  path = item["path"]
                  if not is_text_candidate(path):
                      continue
                  if mode == "fork-overlay" and not fork_overlay_candidate(path):
                      fork_skipped += 1
                      continue
                  size = item.get("size") or 0
                  if size > 2_000_000:
                      print(f"INCOMPLETE_FILE\t{name}\t{default}\t{path}\ttoo_large:{size}")
                      large += 1
                      continue
                  chosen.append(path)
              totals["large"] += large
              totals["fork_upstream_skipped"] += fork_skipped

              def scan_path(path):
                  raw = (
                      f"https://raw.githubusercontent.com/{owner}/"
                      f"{urllib.parse.quote(name, safe='')}/"
                      f"{urllib.parse.quote(default, safe='')}/"
                      f"{urllib.parse.quote(path, safe='/')}"
                  )
                  try:
                      text = request_text(raw)
                  except Exception as exc:
                      return (path, None, [f"FETCH_ERROR {type(exc).__name__}:{exc}"])
                  if text is None:
                      return (path, None, [])
                  hits = []
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if candidate.search(line):
                          hits.append(f"{line_no}\t{line}")
                  return (path, text, hits)

              scanned = 0
              binary = 0
              repo_matches = 0
              fetch_errors = 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
                  futures = [pool.submit(scan_path, path) for path in chosen]
                  for future in concurrent.futures.as_completed(futures):
                      path, text, hits = future.result()
                      if text is None:
                          if hits and hits[0].startswith("FETCH_ERROR"):
                              print(f"INCOMPLETE_FILE\t{name}\t{default}\t{path}\t{hits[0]}")
                              fetch_errors += 1
                          else:
                              binary += 1
                          continue
                      scanned += 1
                      for hit in hits:
                          repo_matches += 1
                          print(f"MATCH\t{name}\t{default}\t{path}\t{hit}")

              totals["scanned"] += scanned
              totals["matches"] += repo_matches
              totals["binary"] += binary
              totals["errors"] += fetch_errors
              print(
                  f"AUDIT_REPO\t{name}\tbranch={default}\tmode={mode}\t"
                  f"tree_blobs={len(blobs)}\ttext_candidates={len(chosen)}\t"
                  f"scanned={scanned}\tmatches={repo_matches}\t"
                  f"fork_upstream_text_skipped={fork_skipped}\tlarge_skipped={large}\t"
                  f"fetch_errors={fetch_errors}"
              )

          print("SUMMARY\t" + "\t".join(f"{k}={v}" for k, v in totals.items()))
          if totals["errors"]:
              sys.exit(2)
          PY
