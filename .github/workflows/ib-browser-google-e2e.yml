name: Independent actual IB browser-assisted Google transaction
on:
  pull_request:
    paths:
      - '.github/workflows/ib-browser-google-e2e.yml'
      - 'ib-source/reader/prepare-google-candidate.grease'
      - 'ib-source/reader/verify-browser-google.grease'
      - 'ib-source/shizuku/observe-browser-google.grease'
      - 'ib-source/shizuku/installed/**'
  workflow_dispatch:
concurrency:
  group: ib-browser-Google-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  actual-google:
    name: Google transaction ART API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
      IB_GOOGLE_SOURCE: 9f04600a358734b063f35e726dadfa5b9c0b0177
      IB_GOOGLE_RUN: '41591963814'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared independent orchestration runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install independent text and HTML verifiers
        shell: sh
        run: make -f ick-host/Makefile extra-packages ICK_BUILD="$RUNNER_TEMP/ick-host-build" PACKAGES='ripgrep libxml2-utils'
      - name: Parse independent Google coordinators
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -n ib-source/reader/prepare-google-candidate.grease > "$RUNNER_TEMP/Google-input.syntax.txt"
          .tools/runtime/.build/grease/bin/grease -n ib-source/reader/verify-browser-google.grease > "$RUNNER_TEMP/Google-source.syntax.txt"
          .tools/runtime/.build/grease/bin/grease -n ib-source/shizuku/observe-browser-google.grease > "$RUNNER_TEMP/Google-ART.syntax.txt"
      - name: Acquire only the exact qualified source job's unchanged candidate
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-google-candidate.grease "$IB_GOOGLE_SOURCE" "$IB_GOOGLE_RUN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Google-candidate"
      - name: Verify the genuine maintained ChordReader development APK
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/prepare-chord-handoff.grease "$RUNNER_TEMP/ChordReader-input"
      - name: Retain ICK and reclaim job-owned build intermediates before the emulator
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-native-network/prepare-emulator-host.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/Google-host-capacity"
      - name: Prepare emulator KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Require genuine Search, native result touch, ICU destination and offline retained navigation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '${{ matrix.api }}'
          AICI_FIXTURE_ICK: ${{ steps.ick.outputs.compiler }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          avd-name: IB-Google-api${{ matrix.api }}
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-installed.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Google-candidate/input/native-client" "$RUNNER_TEMP/Google-candidate/input/oracles/smali.jar" "$ANDROID_HOME" "$RUNNER_TEMP/Google-candidate/input/platform-inputs/public-test-keystore" "$RUNNER_TEMP/Google-candidate/input/platform-inputs/shizuku-official.apk" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/Google-observed/installed" reader-v2
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-navigation.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Google-candidate/input" "$ANDROID_HOME" "$AICI_FIXTURE_ICK" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/Google-observed/installed" "$RUNNER_TEMP/Google-observed/navigation" reader-v4
            .tools/runtime/.build/grease/bin/grease ib-source/shizuku/observe-browser-google.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Google-candidate/input" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/Google-observed/installed" "$RUNNER_TEMP/Google-observed/navigation" "$RUNNER_TEMP/ChordReader-input" "$RUNNER_TEMP/Google-observed/Google"
      - name: Retain Google transaction sources and diagnostics separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IB-Google-transaction-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/Google-candidate/input-identity.tsv
            ${{ runner.temp }}/Google-candidate/selected-artifacts.json
            ${{ runner.temp }}/Google-candidate/observer.commit
            ${{ runner.temp }}/Google-observed/Google
            ${{ runner.temp }}/ChordReader-input/input-identity.tsv
          if-no-files-found: warn
      - name: Retain complete independent Android observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IB-Google-E2E-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/Google-candidate/input-identity.tsv
            ${{ runner.temp }}/Google-candidate/declared-run.json
            ${{ runner.temp }}/Google-candidate/producer-jobs.json
            ${{ runner.temp }}/Google-candidate/selected-artifacts.json
            ${{ runner.temp }}/Google-candidate/observer.commit
            ${{ runner.temp }}/Google-host-capacity
            ${{ runner.temp }}/Google-observed
            ${{ runner.temp }}/ChordReader-input/input-identity.tsv
          if-no-files-found: warn
