name: Blackball live OpenAI network probe

on:
  push:
    paths:
      - '.github/workflows/blackball-live-openai-probe.yml'

permissions:
  contents: read

jobs:
  live-openai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Send one genuine Responses API prompt
        shell: python3 {0}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          import os
          import subprocess
          import sys

          if not os.environ.get('OPENAI_API_KEY'):
              print('OPENAI_API_KEY repository secret is not configured')
              raise SystemExit(78)

          result = subprocess.run(
              [sys.executable, 'evals/blackball/openai_responses_cli.py', 'gpt-5.6-luna'],
              input='Reply with exactly: live provider reached\n',
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )
          print(f'exit_status={result.returncode}')
          print(f'stdout={result.stdout!r}')
          print(f'stderr={result.stderr!r}')
          raise SystemExit(result.returncode)
