name: Independently decode the mismatched ICU command reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/ib-worker-reproduction-diagnostics.yml'
      - 'examples/autogenerated/ib-worker-reproduction-inspection/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared diagnostic runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the declared literal text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Parse the declared Grease inspector before reading an archive
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/ib-worker-reproduction-inspection/inspect.grease > "$RUNNER_TEMP/fragment-inspector.syntax.txt"
      - name: Decode the original two checked ICU worker outputs
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-worker-reproduction-inspection/inspect.grease "$RUNNER_TEMP/fragment-observation"
      - name: Retain bounded outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-worker-DEX-input-difference-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fragment-observation/*.observed.txt
            ${{ runner.temp }}/fragment-observation/*.exit
            ${{ runner.temp }}/fragment-observation/*.sha256
            ${{ runner.temp }}/fragment-observation/parser-version.txt
            ${{ runner.temp }}/fragment-observation/receipt.tsv
          if-no-files-found: warn
