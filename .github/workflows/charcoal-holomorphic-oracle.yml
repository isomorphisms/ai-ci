name: Holomorphic timer and numerical observation boundary
on:
  pull_request:
    paths:
      - examples/autogenerated/holomorphic-phase-log/**
      - .github/workflows/charcoal-holomorphic-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ITHON_PYTHON: /usr/bin/python3
      ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ithon-checks.jsonl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon-runtime
          persist-credentials: false
      - run: ./ithon-runtime/ithon examples/autogenerated/holomorphic-phase-log/HolomorphicAcceptance.pi selftest "$RUNNER_TEMP/holo-checker-controls"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: holomorphic-independent-checker-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/holo-checker-controls
            ${{ runner.temp }}/ithon-checks.jsonl
