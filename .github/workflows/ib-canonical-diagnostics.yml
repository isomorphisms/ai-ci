name: Inspect the exact canonical response failure
on:
  pull_request:
    paths:
      - '.github/workflows/ib-canonical-diagnostics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Public controlled host fixture only; read-only failure retrieval.
      # Candidate IB 9c599c726dd798477e55394c42234e060c0b460e.
      # Original ZIP SHA-256 ec4a454c6b19b1cf18ff07e81bee1cf3561008049fa540ed0eebfa052ae99b49.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          github-token: ${{ github.token }}
          run-id: 41284806549
          artifact-ids: '13075165643'
          merge-multiple: true
          path: ${{ runner.temp }}/canonical-IB
      - name: Read the actual canonical assertion output
        shell: sh
        run: cat "$RUNNER_TEMP/canonical-IB/native-canonical/frame.txt"
  reader_index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Original compact ZIP SHA-256 120446c88e227ca7097c857cfcbe848382a69b0d0fd640576ffc942740a69923.
      # Exact visible-title IB candidate 54b4bdaf287fd83a411c158873eab228362c2f72.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          github-token: ${{ github.token }}
          run-id: 41284137606
          artifact-ids: '13075181656'
          merge-multiple: true
          path: ${{ runner.temp }}/reader-IB
      - name: Read the exact API 29 independent index failure
        shell: sh
        run: cat "$RUNNER_TEMP/reader-IB/observed-api29/installed/index-positive.txt"
      - name: Read the exact API 34 independent index failure
        shell: sh
        run: cat "$RUNNER_TEMP/reader-IB/observed-api34/installed/index-positive.txt"
  reflow_label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Exact IB 0592dd8 native-reader candidate, public Example only.
      # ZIP SHA-256 e0fe44024db1a1290cede98338c849c83b867ed2032ff8272970405dcf7e8eac.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          github-token: ${{ github.token }}
          run-id: 41285921461
          artifact-ids: '13075803624'
          merge-multiple: true
          path: ${{ runner.temp }}/reflow-IB
      - name: Read the actual API 29 rendered controls
        shell: sh
        run: cat "$RUNNER_TEMP/reflow-IB/observed-api29/installed/actual-reflow-and-clipboard.ui.xml"
      - name: Read the actual API 34 rendered controls
        shell: sh
        run: cat "$RUNNER_TEMP/reflow-IB/observed-api34/installed/actual-reflow-and-clipboard.ui.xml"
  observer_verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Exact independent observer ab91ef6, replaying the unchanged 54b4bdaf APK.
      # API 29 replay ZIP SHA-256 0572ac97cae9dc9c034414666f1109712c46222e93500748376eb059838cbb00.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ai-ci
          github-token: ${{ github.token }}
          run-id: 41287153951
          artifact-ids: '13074784259'
          merge-multiple: true
          path: ${{ runner.temp }}/observer-IB
      - name: Read the actual new observer runtime exception
        shell: sh
        run: grep -E 'AndroidRuntime:|VerifyError|Rejecting' "$RUNNER_TEMP/observer-IB/observed/absent-and-unauthorized.logcat.txt"
