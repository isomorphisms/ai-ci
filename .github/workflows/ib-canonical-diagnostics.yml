name: Inspect exact IB reader SDK diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/ib-canonical-diagnostics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ib-reader-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            artifact: '13076686531'
            digest: a2ba5ad52f6f323111c3b4dcaa94960f96e228012e326d211c23dbd9c61e3258
          - api: 34
            artifact: '13076552160'
            digest: 663f8a810205fd485b8deefb6a227ba1c4a1193cad3d6c5a039aa9d6a70c4ef2
    steps:
      # Exact observer f496c134, unchanged IB 0592dd8e.
      # Original archive digests are recorded in the explicit matrix above.
      # Completed older one-off retrievals remain in Git/run history.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ai-ci
          github-token: ${{ github.token }}
          run-id: 41288756080
          artifact-ids: ${{ matrix.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/reader-SDK
      - name: Read the actual accessible reflow label before the assertion
        shell: sh
        run: grep -F IBIndependentReflowLabel "$RUNNER_TEMP/reader-SDK/observed/actual-reflow-and-clipboard.logcat.txt"
