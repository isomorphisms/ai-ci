name: Inspect exact IB reader SDK diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/ib-canonical-diagnostics.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ib-reader-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Exact IB eaa430ab maintained checked SEARCH/Activity source.
      # Public controlled fixture; read-only diagnostic, not acceptance.
      # Original ZIP SHA-256 295265e43d1ad0b1dad2ba5825aad27074405ba397f8ab66fc2d209f86384616.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          github-token: ${{ github.token }}
          run-id: 41293789306
          artifact-ids: '13078454294'
          merge-multiple: true
          path: ${{ runner.temp }}/reader-SDK
      - name: Read the exact failed native navigation stage
        shell: sh
        run: cat "$RUNNER_TEMP/reader-SDK/observed-api34/navigation/actual-link-history.txt"
      - name: Read bounded actual observer and framework failure evidence
        shell: sh
        run: grep -m 160 -E 'AssertionError|at acceptance[.]|IBIndependent|FATAL EXCEPTION|Unable to|ActivityTaskManager.*(ib[.]prepaint|shizuku)' "$RUNNER_TEMP/reader-SDK/observed-api34/navigation/actual-link-history.logcat.txt"
