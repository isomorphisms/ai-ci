name: Porthole and WiFi Scanner charcoal lifecycle
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-frontends.yml
      - charcoal/observe-lifecycle.grease
      - charcoal/check-frame.grease
      - charcoal/check-startup-video.grease
      - examples/autogenerated/charcoal-frontends/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/porthole
          run-id: 42002138345
          artifact-ids: 13403550049
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/porthole
      - run: echo '350834be74b4e113095422b78b8a5238ed9a9e0fb1fad56f7a3b1d5461faaa2f  candidate/porthole/porthole-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/WifiScanner
          run-id: 42002148615
          artifact-ids: 13403017351
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/wifi
      - run: echo 'a1b49ca7a09d24fb29b4c812e52ec01bf008cedcaa7b452cdf1d82bdc50a52fb  candidate/wifi/outputs/apk/debug/app-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Require the decoded-video positive and white-frame negative
        run: '"$CHARCOAL_GREASE" charcoal/qualify-video-guard.grease "$GITHUB_WORKSPACE" "$(command -v ffmpeg)" "$RUNNER_TEMP/charcoal-frontends-video-guard"'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: |
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/porthole/porthole-debug.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-frontend-porthole" "${{ matrix.api }}" com.stevenfoerster.porthole com.stevenfoerster.porthole.ui.MainActivity 525bca2cedda6235efd586043a4f3e75beedb1657b1361bcc519ebd3e5f1b194 6995e71de244d113428f9c7c0b0755eb5d7ac3c0 42002138345 landscape porthole
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/wifi/outputs/apk/debug/app-debug.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-frontend-wifi" "${{ matrix.api }}" com.wifiscanner.app com.wifiscanner.app.MainActivity 4eb1a2222544ff1ba4869587a3cc717fd52f6036c550572f9c81028c21266c94 cba330d298a66b156daad4cbd33a99423feed189 42002148615 portrait wifi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charcoal-frontends-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/charcoal-frontend*
          if-no-files-found: warn
