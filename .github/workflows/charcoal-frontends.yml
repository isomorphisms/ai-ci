name: Porthole and WiFi frontends charcoal lifecycle
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-frontends.yml
      - charcoal/observe-lifecycle.grease
      - charcoal/activity-match.grease
      - charcoal/replay-frontend.grease
      - charcoal/qualify-activity-match.grease
      - charcoal/check-frame.grease
      - charcoal/check-startup-video.grease
      - examples/autogenerated/charcoal-frontends/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend: [porthole, wifi, wifi-analyzer]
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/porthole
          run-id: 42016835371
          artifact-ids: 13408974539
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/porthole
      - run: echo '90599bb3c2c02cd4f2688f53bca988e879f26b3323d0d2f89722854e8bf4889a  candidate/porthole/porthole-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/WifiScanner
          run-id: 42002148615
          artifact-ids: 13403017351
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/wifi
      - run: echo 'a1b49ca7a09d24fb29b4c812e52ec01bf008cedcaa7b452cdf1d82bdc50a52fb  candidate/wifi/outputs/apk/debug/app-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/WiFiAnalyzer
          run-id: 42009723843
          artifact-ids: 13406972582
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/wifi-analyzer
      - run: echo '0f330e1f6dd313f892e30ac6f216fb8ba25b2f4390676b13dfaef2a0909dab1c  candidate/wifi-analyzer/app-debug.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: '"$CHARCOAL_GREASE" charcoal/qualify-activity-match.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/charcoal-activity-match"'
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Require the decoded-video positive and white-frame negative
        run: '"$CHARCOAL_GREASE" charcoal/qualify-video-guard.grease "$GITHUB_WORKSPACE" "$(command -v ffmpeg)" "$RUNNER_TEMP/charcoal-frontends-video-guard"'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$CHARCOAL_GREASE" charcoal/replay-frontend.grease "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$RUNNER_TEMP" "${{ matrix.api }}" "${{ matrix.frontend }}"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charcoal-frontends-${{ matrix.frontend }}-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/charcoal-frontend*
          if-no-files-found: warn
