name: Inspect the exact Google continuation page
on:
  pull_request:
    paths:
      - '.github/workflows/ib-search-result-diagnostics.yml'
      - 'examples/autogenerated/ib-google-continuation/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '29'
            artifact: '13092417318'
            digest: 2660c5cf5cc3226c82586f45324a6e83344a53b8d9eaeeca4a6f1932cf99c02e
            size: '12968633'
          - api: '34'
            artifact: '13092696825'
            digest: 3b021cb657bdaf70d7cd9ccaff38de5d3ddac057d67e5ca970c1428281844243
            size: '20806041'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared diagnostic runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared literal text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Install the declared independent HTML parser
        shell: sh
        run: make -f ick-host/Makefile extra-packages ICK_BUILD="$RUNNER_TEMP/ick-host-build" PACKAGES=libxml2-utils
      - name: Parse the declared Grease inspector before reading an archive
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/ib-google-continuation/inspect.grease > "$RUNNER_TEMP/Google-inspector.syntax.txt"
      - name: Inspect exact runtime view and independently read the captured original response
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-google-continuation/inspect.grease "$GITHUB_WORKSPACE" "${{ matrix.artifact }}" "${{ matrix.digest }}" "${{ matrix.size }}" "$RUNNER_TEMP/Google-observation" "${{ matrix.api }}"
      - name: Retain bounded outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Google-response-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/Google-observation/*.observed.txt
            ${{ runner.temp }}/Google-observation/*.exit
            ${{ runner.temp }}/Google-observation/*.sha256
            ${{ runner.temp }}/Google-observation/parser-version.txt
            ${{ runner.temp }}/Google-observation/receipt.tsv
          if-no-files-found: warn
