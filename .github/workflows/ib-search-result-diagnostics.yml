name: Inspect the exact ChordReader Google response
on:
  pull_request:
    paths:
      - '.github/workflows/ib-search-result-diagnostics.yml'
      - 'ib-source/reader/inspect-google.grease'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '29'
            artifact: '13080282817'
            digest: 57e4e8642b0b186b82fa693e4a560fe222107993e84512e42531ab00674aafbd
            size: '11187382'
          - api: '34'
            artifact: '13080253654'
            digest: a86ec068ea8a138f2c453bd0035b7469f18dc92b8507a1b71551b81f8acec742
            size: '14698646'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared diagnostic runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared literal text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Inspect exact runtime view and independently read the captured original response
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/inspect-google.grease "$GITHUB_WORKSPACE" "${{ matrix.artifact }}" "${{ matrix.digest }}" "${{ matrix.size }}" "$RUNNER_TEMP/Google-observation" "${{ matrix.api }}"
      - name: Retain bounded outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Google-response-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/Google-observation/actual-Google-view.txt
            ${{ runner.temp }}/Google-observation/Google-source-readback.txt
          if-no-files-found: warn
