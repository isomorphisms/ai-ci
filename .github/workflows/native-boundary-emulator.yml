name: Native Android emulator boundary

on:
  push:
    branches: [main]
    paths: ['native-boundary/**', '.github/workflows/native-boundary-emulator.yml']
  pull_request:
    paths: ['native-boundary/**', '.github/workflows/native-boundary-emulator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: page4k
            image_target: google_apis
            expected_page_size: '4096'
          - lane: page16k
            image_target: google_apis_ps16k
            expected_page_size: '16384'
    env:
      NDK_ARCHIVE_SHA1: 22105e410cf29afcf163760cc95522b9fb981121
      OUTPUT: native-boundary-android-x86_64-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      EXPECTED_PAGE_SIZE: ${{ matrix.expected_page_size }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Android NDK r27d
        shell: bash
        run: |
          set -eux
          archive="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$archive"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          grep -F 'Pkg.Revision = 27.3.13750724' "$RUNNER_TEMP/android-ndk-r27d/source.properties"
          printf 'ANDROID_NDK_HOME=%s/android-ndk-r27d\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build exact-source Android x86-64 bundle
        shell: bash
        run: |
          set -eux
          bash native-boundary/build.sh android-x86_64 "$OUTPUT"

      - name: Enable KVM access when available
        shell: bash
        run: |
          set -eux
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo 'No /dev/kvm; emulator action will use its available fallback.'
          fi

      - name: Execute bundle on Android ${{ matrix.lane }} emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: ${{ matrix.image_target }}
          arch: x86_64
          disable-animations: true
          script: |
            adb shell 'rm -rf /data/local/tmp/aici-native-boundary && mkdir -p /data/local/tmp/aici-native-boundary'
            adb push "$OUTPUT/bundle" /data/local/tmp/aici-native-boundary/
            adb shell 'chmod 755 /data/local/tmp/aici-native-boundary/bundle/probe-default /data/local/tmp/aici-native-boundary/bundle/probe-largefile'
            adb shell 'cd /data/local/tmp/aici-native-boundary && sh bundle/run.sh receipts'
            mkdir "$OUTPUT/emulator-runtime-$LANE"
            adb pull /data/local/tmp/aici-native-boundary/receipts/. "$OUTPUT/emulator-runtime-$LANE/"
            revision=$(git rev-parse HEAD); for file in default.tsv largefile.tsv; do grep -F "$(printf 'source\t%s' "$revision")" "$OUTPUT/emulator-runtime-$LANE/$file"; grep -F "$(printf 'libc\tbionic')" "$OUTPUT/emulator-runtime-$LANE/$file"; grep -F "$(printf 'page_size\t%s' "$EXPECTED_PAGE_SIZE")" "$OUTPUT/emulator-runtime-$LANE/$file"; grep -F "$(printf 'summary\tPASS\tfailures=0')" "$OUTPUT/emulator-runtime-$LANE/$file"; done
            grep -F "$(printf 'execution_class\tandroid-runtime-unclassified')" "$OUTPUT/emulator-runtime-$LANE/runtime.tsv"
            grep -F "$(printf 'result\tPASS')" "$OUTPUT/emulator-runtime-$LANE/runtime.tsv"

      - name: Retain exact bundle and emulator runtime receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-boundary-android-emulator-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ env.OUTPUT }}/
          if-no-files-found: error
