name: Inspect exact native fragment point traces
on:
  pull_request:
    paths:
      - '.github/workflows/ib-fragment-diagnostics.yml'
      - 'examples/autogenerated/ib-native-fragment-inspection/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '29'
            artifact: '13097555322'
            digest: e15118ec05408c3f1d1bc10a45681215aa6fb7e3b437606ed6230b5b2fec798a
            size: '21468063'
          - api: '34'
            artifact: '13097530859'
            digest: 78e00f0d443e57e244b181df2456a2ddc8c52c81443ce2bc8f4ee6d3acd1d91b
            size: '25016268'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared diagnostic runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared literal text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Parse the declared Grease inspector before reading an archive
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/ib-native-fragment-inspection/inspect.grease > "$RUNNER_TEMP/fragment-inspector.syntax.txt"
      - name: Read exact retained native viewport and point traces
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-native-fragment-inspection/inspect.grease "${{ matrix.artifact }}" "${{ matrix.digest }}" "${{ matrix.size }}" "${{ matrix.api }}" "$RUNNER_TEMP/fragment-observation"
      - name: Retain bounded outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fragment-trace-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fragment-observation/*.observed.txt
            ${{ runner.temp }}/fragment-observation/*.exit
            ${{ runner.temp }}/fragment-observation/*.sha256
            ${{ runner.temp }}/fragment-observation/parser-version.txt
            ${{ runner.temp }}/fragment-observation/receipt.tsv
          if-no-files-found: warn
