name: Native libc boundary

on:
  push:
    paths: ['native-boundary/**', '.github/workflows/native-boundary.yml']
  pull_request:
    paths: ['native-boundary/**', '.github/workflows/native-boundary.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [host, armv7a, aarch64]
    env:
      NDK_ARCHIVE_SHA1: 22105e410cf29afcf163760cc95522b9fb981121
    steps:
      - name: Check Ubuntu build environment
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64
      - name: Install host build prerequisites
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl unzip
      - name: Install pinned Android NDK r27d
        if: matrix.target != 'host'
        shell: bash
        run: |
          set -eux
          archive="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            --output "$archive"
          printf '%s  %s\n' "$NDK_ARCHIVE_SHA1" "$archive" | sha1sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          grep -F 'Pkg.Revision = 27.3.13750724' "$RUNNER_TEMP/android-ndk-r27d/source.properties"
          printf 'ANDROID_NDK_HOME=%s/android-ndk-r27d\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build native probes and run available host checks
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: ${{ runner.temp }}/native-boundary-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash native-boundary/build.sh "$TARGET" "$OUTPUT"
      - name: Retain exact-source bundle, ELF inspection and available receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-boundary-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-boundary-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
