name: Versioned charcoal candidate identity receipts
on:
  pull_request:
    paths:
      - .github/workflows/charcoal-identities.yml
      - charcoal/identify-apks.grease
      - charcoal/candidate-identities.tsv
      - examples/autogenerated/charcoal-identities/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 42005246209
          artifact-ids: 13404806762
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/fastchat
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 42005246209
          artifact-ids: 13404273076
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/fastchat-c67
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/ChatGPTExporter
          run-id: 42005266500
          artifact-ids: 13403864526
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/exporter
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13404523390
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/pasteboard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/tablature
          run-id: 42005268924
          artifact-ids: 13406241036
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/chord
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/porthole
          run-id: 42002138345
          artifact-ids: 13403550049
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/porthole
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/WifiScanner
          run-id: 42002148615
          artifact-ids: 13403017351
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/wifi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          run-id: 42005259942
          artifact-ids: 13406667414
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/ib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/WiFiAnalyzer
          run-id: 42009723843
          artifact-ids: 13406972582
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/wifi-analyzer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - name: Observe actual APK digests, signer and package identity
        run: grease/bin/grease charcoal/identify-apks.grease "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/charcoal/candidate-identities.tsv" "$ANDROID_HOME" "$GITHUB_WORKSPACE/identity-receipts"
      - name: Acquire actual API35 failed control evidence without rerunning or weakening it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13406493088
          github-token: ${{ github.token }}
          merge-multiple: true
          path: failed-api35
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Read the preserved failing control boundary
        run: grease/bin/grease charcoal/read-control-failure.grease "$GITHUB_WORKSPACE/failed-api35" "$GITHUB_WORKSPACE/control-failure-readback"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charcoal-candidate-identity-receipts
          path: |
            identity-receipts/
            control-failure-readback/
          if-no-files-found: warn
