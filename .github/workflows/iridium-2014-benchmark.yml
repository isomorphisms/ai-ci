name: Iridium 2014 benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/iridium-2014/**"
      - ".github/workflows/iridium-2014-benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/iridium-2014/**"
      - ".github/workflows/iridium-2014-benchmark.yml"

permissions:
  contents: read

jobs:
  linux-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Pin original Iridium source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/puffnfresh/iridium.git upstream-iridium
          git -C upstream-iridium checkout 2dc438475962b62f6ca8d00f0dff3add87418dec
          test "$(git -C upstream-iridium rev-parse HEAD)" = 2dc438475962b62f6ca8d00f0dff3add87418dec

      - name: Build historical Idris and Iridium ELF fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            migamake/haskell-build:7.8@sha256:b380cec2689828577306a78d58407d2dbb0beb3a5bd556e1e8d969253918e56c \
            bash benchmarks/iridium-2014/build-linux.sh

      - name: Inspect ELF ourselves
        shell: bash
        run: |
          set -euxo pipefail
          file artifacts/iridium-core | tee artifacts/file.txt
          stat --printf='%s\n' artifacts/iridium-core | tee artifacts/file-bytes.txt
          sha256sum artifacts/iridium-core | tee artifacts/binary.sha256
          size artifacts/iridium-core | tee artifacts/size.txt
          ldd artifacts/iridium-core | tee artifacts/ldd.txt
          readelf -hW artifacts/iridium-core > artifacts/readelf-header.txt
          readelf -SW artifacts/iridium-core > artifacts/readelf-sections.txt
          readelf -lW artifacts/iridium-core > artifacts/readelf-program-headers.txt
          readelf -dW artifacts/iridium-core > artifacts/readelf-dynamic.txt
          readelf -sW artifacts/iridium-core > artifacts/readelf-symbols.txt
          readelf -rW artifacts/iridium-core > artifacts/readelf-relocations.txt
          nm -S --size-sort artifacts/iridium-core > artifacts/nm-size-sort.txt
          wc -c artifacts/iridium-quartz-generated.c | tee artifacts/quartz-generated-c-bytes.txt
          sha256sum artifacts/iridium-quartz-generated.c | tee artifacts/quartz-generated-c.sha256

      - name: Package Linux evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iridium-2014-linux-elf
          path: artifacts/
          if-no-files-found: error

  macos-macho:
    needs: linux-elf
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Recover generated Idris C
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: iridium-2014-linux-elf
          path: linux-evidence

      - name: Pin Iridium and matching Idris runtime source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/puffnfresh/iridium.git upstream-iridium
          git -C upstream-iridium checkout 2dc438475962b62f6ca8d00f0dff3add87418dec
          curl --fail --location --retry 3 \
            https://hackage.haskell.org/package/idris-0.9.14.3/idris-0.9.14.3.tar.gz \
            --output idris-0.9.14.3.tar.gz
          tar -xzf idris-0.9.14.3.tar.gz

      - name: Rebuild the 2014 C runtime and Quartz boundary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p macho-build macho-evidence
          RTS="$PWD/idris-0.9.14.3/rts"
          CFLAGS="-O2 -fwrapv -fno-strict-overflow -DHAS_PTHREAD -I$RTS"

          for src in \
            idris_rts.c idris_heap.c idris_gc.c idris_gmp.c idris_bitstring.c \
            idris_opts.c idris_stats.c mini-gmp.c idris_stdfgn.c idris_net.c
          do
            clang $CFLAGS -c "$RTS/$src" -o "macho-build/${src%.c}.o"
          done
          ar rcs macho-build/libidris_rts.a macho-build/idris_*.o macho-build/mini-gmp.o

          clang -O2 -Wall -Iupstream-iridium/cbits \
            -c upstream-iridium/cbits/ir.c -o macho-build/ir.o
          clang -O2 -Wall -fobjc-arc -fblocks -Iupstream-iridium/cbits \
            -c upstream-iridium/cbits/quartz.m -o macho-build/quartz.o

      - name: Link full Iridium Mach-O reconstruction
        shell: bash
        run: |
          set -euxo pipefail
          RTS="$PWD/idris-0.9.14.3/rts"
          clang -O2 -fwrapv -fno-strict-overflow -DHAS_PTHREAD \
            -I"$RTS" -I"$PWD/upstream-iridium" -I"$PWD/upstream-iridium/cbits" \
            linux-evidence/iridium-quartz-generated.c "$RTS/idris_main.c" \
            macho-build/ir.o macho-build/quartz.o macho-build/libidris_rts.a \
            -framework Cocoa -framework ApplicationServices \
            -F/System/Library/PrivateFrameworks -framework SkyLight \
            -lpthread -lm -o macho-evidence/iridium

      - name: Inspect Mach-O without launching a window manager
        shell: bash
        run: |
          set -euxo pipefail
          file macho-evidence/iridium | tee macho-evidence/file.txt
          stat -f '%z' macho-evidence/iridium | tee macho-evidence/file-bytes.txt
          shasum -a 256 macho-evidence/iridium | tee macho-evidence/binary.sha256
          size macho-evidence/iridium | tee macho-evidence/size.txt
          otool -hv macho-evidence/iridium > macho-evidence/otool-header.txt
          otool -l macho-evidence/iridium > macho-evidence/otool-load-commands.txt
          otool -L macho-evidence/iridium > macho-evidence/otool-libraries.txt
          nm -nm macho-evidence/iridium > macho-evidence/nm.txt

      - name: Package Mach-O evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iridium-2014-macos-macho
          path: macho-evidence/
          if-no-files-found: error
