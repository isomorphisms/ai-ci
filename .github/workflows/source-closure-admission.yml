name: Independent source-checkout admission

on:
  pull_request:
    paths:
      - 'source-closure/**'
      - 'examples/autogenerated/source-admission/**'
      - '.github/workflows/source-closure-admission.yml'
  push:
    paths:
      - 'source-closure/**'
      - 'examples/autogenerated/source-admission/**'
      - '.github/workflows/source-closure-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact independent verifier head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: 2bce7677f513d711875e978bd6f5ad28b9e54d58
          path: _source-idric
          persist-credentials: false
      - name: Check out separately pinned acquisition implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/catfood
          ref: ef6c3ab18c32c0dd82cb345b06c8f97b752cbf0c
          path: _source-catfood
          persist-credentials: false
      - name: Qualify ICK for the compiler owner's support code
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Bootstrap the pinned Idriç through its maintained Chez lane
        working-directory: _source-idric
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./_/edric all
      - name: Compile the independent source verifier
        working-directory: examples/autogenerated/source-admission
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_source-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_source-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_source-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_source-idric/_/libs/base/build/ttc
        run: '"${{ github.workspace }}/_source-idric/_/build/exec/idris2" --no-banner --no-color -o source-admission SourceAdmission.idric'
      - name: Compile independently constructed fixtures
        working-directory: examples/autogenerated/source-admission
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_source-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_source-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_source-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_source-idric/_/libs/base/build/ttc
        run: '"${{ github.workspace }}/_source-idric/_/build/exec/idris2" --no-banner --no-color -o source-admission-fixtures SourceAdmissionFixtures.idric'
      - name: Compile staged actual acquisition replay
        working-directory: examples/autogenerated/source-admission
        shell: sh
        env:
          CHEZ: ${{ github.workspace }}/_source-idric/_/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/_source-idric/_/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/_source-idric/_/libs/prelude/build/ttc:${{ github.workspace }}/_source-idric/_/libs/base/build/ttc
        run: '"${{ github.workspace }}/_source-idric/_/build/exec/idris2" --no-banner --no-color -o source-acquisition-replay SourceAcquisitionReplay.idric'
      - name: Execute independent positive, corrupt and benign source cases
        shell: sh
        run: 'examples/autogenerated/source-admission/build/exec/source-admission-fixtures "${{ github.workspace }}/examples/autogenerated/source-admission/build/exec/source-admission" "${{ github.workspace }}/_source-catfood/catfood" "${{ runner.temp }}/source-fixtures"'
      - name: Acquire actual ICK workbench source and admit it independently
        shell: sh
        run: 'examples/autogenerated/source-admission/build/exec/source-acquisition-replay "${{ github.workspace }}/examples/autogenerated/source-admission/build/exec/source-admission" "${{ github.workspace }}/_source-catfood/catfood" "${{ github.workspace }}/source-closure/contracts/ick-workbench.tsv" "${{ runner.temp }}/source-workbench" workbench'
      - name: Acquire the actual locked GCC reference and admit it independently
        shell: sh
        run: 'examples/autogenerated/source-admission/build/exec/source-acquisition-replay "${{ github.workspace }}/examples/autogenerated/source-admission/build/exec/source-admission" "${{ github.workspace }}/_source-catfood/catfood" "${{ github.workspace }}/source-closure/contracts/ick-producer.tsv" "${{ runner.temp }}/source-producer" producer'
      - name: Retain independent observations and acquisition records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-admission-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/source-fixtures/
            ${{ runner.temp }}/source-workbench/*.tsv
            ${{ runner.temp }}/source-workbench/*.txt
            ${{ runner.temp }}/source-producer/*.tsv
            ${{ runner.temp }}/source-producer/*.txt
