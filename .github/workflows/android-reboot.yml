name: Observe a fresh Android kernel after reboot
on:
  pull_request:
    paths:
      - android-reboot/**
      - pasteboard/observe-controls.grease
      - examples/autogenerated/android-reboot-identity/**
      - .github/workflows/android-reboot.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
          - api: 35
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@ebfb667b64009f0c0bdf9dcfafb7884196786ef5
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Reject stale, incomplete and malformed boot observations
        run: '"$GREASE" android-reboot/selftest.grease "$GITHUB_WORKSPACE" "$GREASE" "$RUNNER_TEMP/reboot-controls"'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$GREASE" android-reboot/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ matrix.api }}" "$GREASE" "$RUNNER_TEMP/reboot-actual"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-reboot-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/reboot-controls
            ${{ runner.temp }}/reboot-actual
