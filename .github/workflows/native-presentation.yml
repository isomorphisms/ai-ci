name: Independent pinned native presentation
on:
  pull_request:
    paths:
      - charcoal/**
      - examples/autogenerated/native-presentation/**
      - .github/workflows/native-presentation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-native-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  c67-delivery:
    name: Independent signed C67 delivery and artifact controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 41766075259
          artifact-ids: 13293216565
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Verify exact deliverable and reject wrong source, ABI and changed signed bytes
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/qualify-fastchat-delivery.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/grease/_bin/cxx-asan/ysh" "$GITHUB_WORKSPACE/candidate/fastchat.apk"
          759605c434fc94b6ea3ce604710f8340a36918a8 "$ANDROID_HOME" "$RUNNER_TEMP/c67-delivery"
          e7f1d847cfea4c1dccee164c643ded8c3b57f5b82d62aa6112188e0c9f435936
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-C67-delivery-759605c4-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/c67-delivery
  fastchat-ui:
    name: FastChat native UI API ${{ matrix.api }} ${{ matrix.expected }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
            expected: pass
            source: 759605c434fc94b6ea3ce604710f8340a36918a8
            producer: 41766075259
            artifact: 13292987492
          - api: 34
            target: google_apis
            expected: pass
            source: 759605c434fc94b6ea3ce604710f8340a36918a8
            producer: 41766075259
            artifact: 13292987492
          - api: 29
            target: default
            expected: refused
            source: 0c5288a207595a0d6924875731091092595fa711
            producer: 41751490657
            artifact: 13286571421
          - api: 29
            target: default
            expected: secure-refused
            source: aaabc570c4416fd3e39fc72154ba176fe750853f
            producer: 41753731428
            artifact: 13286189228
          - api: 29
            target: default
            expected: frame-refused
            source: bdae9a45abca9d7a75aaeb2e6b93e971a06f3760
            producer: 41754800398
            artifact: 13288600748
          - api: 29
            target: default
            expected: ime-pass
            source: 759605c434fc94b6ea3ce604710f8340a36918a8
            producer: 41766075259
            artifact: 13292987492
          - api: 34
            target: google_apis
            expected: ime-pass
            source: 759605c434fc94b6ea3ce604710f8340a36918a8
            producer: 41766075259
            artifact: 13292987492
          - api: 29
            target: default
            expected: ime-refused
            source: 759605c434fc94b6ea3ce604710f8340a36918a8
            producer: 41766075259
            artifact: 13292987492
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact product source, separate from the observer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/fastchat
          ref: ${{ matrix.source }}
          path: product
          persist-credentials: false
      - name: Actual signed x86 candidate from its exact-source producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: ${{ matrix.producer }}
          artifact-ids: ${{ matrix.artifact }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
      - name: Pinned Grease runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Pinned independent bytecode assembler
        run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Inspect actual signed candidate and exact embedded source
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/verify-fastchat-input.grease
          "$GITHUB_WORKSPACE/candidate/fastchat.apk" "${{ matrix.source }}"
          "$ANDROID_HOME" "$RUNNER_TEMP/fastchat-input"
      - name: Compile and sign the independent observer
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/prepare-fastchat.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/product" "$ANDROID_HOME" "$GITHUB_WORKSPACE/smali.jar"
          "$GITHUB_WORKSPACE/product/android/signing/fastchat-comparison-dev.jks" "$RUNNER_TEMP/fastchat-observer"
      - run: sudo chmod 666 /dev/kvm
      - name: Execute the actual product and independent observer on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/observe-fastchat-case.grease
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/grease/_bin/cxx-asan/ysh"
            "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/candidate/fastchat.apk"
            "$RUNNER_TEMP/fastchat-observer" "$RUNNER_TEMP/fastchat-UI" "${{ matrix.api }}" "${{ matrix.expected }}"
      - name: Retain independent source and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-FastChat-API${{ matrix.api }}-${{ matrix.expected }}-${{ matrix.source }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fastchat-input
            ${{ runner.temp }}/fastchat-observer
            ${{ runner.temp }}/fastchat-UI
  timeline-host:
    name: Independent durable timeline worker and producer mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
      GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/fastchat
          ref: 759605c434fc94b6ea3ce604710f8340a36918a8
          path: product
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x "$GREASE"
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Independently compile and execute actual source and controlled producer mutations
        run: >
          "$GREASE" examples/autogenerated/native-presentation/verify-timeline.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/product" "${{ steps.ick.outputs.compiler }}"
          "$RUNNER_TEMP/timeline-acceptance"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-timeline-worker-759605c4-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/timeline-acceptance
