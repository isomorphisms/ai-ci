name: Independent pinned native presentation
on:
  pull_request:
    paths:
      - examples/autogenerated/native-presentation/**
      - .github/workflows/native-presentation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fastchat-ui:
    name: FastChat native UI API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact product source, separate from the observer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/fastchat
          ref: 9cc1442b0e3af85d640263a0e5caba91dd4745b4
          path: product
          persist-credentials: false
      - name: Actual signed x86 candidate from its exact-source producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 41697939102
          artifact-ids: 13264590142
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
      - name: Pinned Grease runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Pinned independent bytecode assembler
        run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Inspect actual signed candidate and exact embedded source
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/verify-fastchat-input.grease
          "$GITHUB_WORKSPACE/candidate/fastchat.apk" 9cc1442b0e3af85d640263a0e5caba91dd4745b4
          "$ANDROID_HOME" "$RUNNER_TEMP/fastchat-input"
      - name: Compile and sign the independent observer
        run: >
          grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/prepare-fastchat.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/product" "$ANDROID_HOME" "$GITHUB_WORKSPACE/smali.jar"
          "$GITHUB_WORKSPACE/product/android/signing/fastchat-comparison-dev.jks" "$RUNNER_TEMP/fastchat-observer"
      - run: sudo chmod 666 /dev/kvm
      - name: Execute the actual product and independent observer on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            grease/_bin/cxx-asan/ysh examples/autogenerated/native-presentation/observe-fastchat.grease
            "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/candidate/fastchat.apk"
            "$RUNNER_TEMP/fastchat-observer" "$RUNNER_TEMP/fastchat-UI" "${{ matrix.api }}"
      - name: Retain independent source and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-FastChat-API${{ matrix.api }}-9cc1442b-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fastchat-input
            ${{ runner.temp }}/fastchat-observer
            ${{ runner.temp }}/fastchat-UI
