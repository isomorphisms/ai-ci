name: complex/projective receipt policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  receipt-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove hierarchy receipts fail closed
        run: python3 complex-projective/verify_receipt.py self-test
