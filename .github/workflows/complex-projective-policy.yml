name: complex/projective receipt policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  receipt-policy:
    name: ${{ github.event_name == 'pull_request' && 'receipt-policy' || format('receipt-policy-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove hierarchy receipts fail closed
        run: python3 complex-projective/verify_receipt.py self-test
