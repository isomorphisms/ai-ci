name: Priority charcoal lifecycle and startup capture
on:
  pull_request:
    paths:
      - charcoal/observe-lifecycle.grease
      - charcoal/check-frame.grease
      - charcoal/check-startup-video.grease
      - charcoal/qualify-video-guard.grease
      - .github/workflows/charcoal-lifecycle.yml
      - examples/autogenerated/charcoal-lifecycle/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 41990448769
          artifact-ids: 13398146684
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/fastchat
      - run: echo '73433b02e5de5287a16f49ff8c1ef75b02d18c11e6539513e16cfd5e8307163c  candidate/fastchat/fastchat.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          run-id: 41990454666
          artifact-ids: 13400366625
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/ib
      - run: echo 'abd32edc04efc2451db6bb14085ff446bddc6156657d333ac2f148fce7357d1d  candidate/ib/native-client/ib-native-boundary.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/ChatGPTExporter
          run-id: 41990459787
          artifact-ids: 13398432041
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/exporter
      - run: echo '0720fcfb7f83a00c3f8117dba0b1e6f15b5fad54369dc169e5d50c9fea5fa980  candidate/exporter/production-reader.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 41990472251
          artifact-ids: 13398546503
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/pasteboard
      - run: echo 'eff26c34ed6dc400ae916038616ed32a45ba83be864ee4ae3f574c9f56f9abef  candidate/pasteboard/pasteboard-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/tablature
          run-id: 41990465047
          artifact-ids: 13398119356
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/chord
      - run: echo '000985a42cc2931b3e1efe546f40194bde383415d2ffedbfbd53ba3927767b53  candidate/chord/android/chordreader-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Require decoded-video positive and one-white-frame rejection
        run: '"$CHARCOAL_GREASE" charcoal/qualify-video-guard.grease "$GITHUB_WORKSPACE" "$(command -v ffmpeg)" "$RUNNER_TEMP/charcoal-video-guard"'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: |
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/fastchat/fastchat.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-fastchat" "${{ matrix.api }}" org.isomorphisms.fastchat.diskstreaming.arena android.app.NativeActivity aa9151e3922fa4795987c3655bc7aa4712620f1d94c24a2075acd7b29d8ac86e 215ef98c09e667cdb4335d19a7041a49c7d6e5e1 41990448769 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/ib/native-client/ib-native-boundary.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-ib" "${{ matrix.api }}" org.isomorphisms.ib.prepaint Idric.Generated de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 336c17c5bc3975f7e113c4ffec4de69687ebd2aa 41990454666 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/exporter/production-reader.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-exporter" "${{ matrix.api }}" org.isomorphisms.chatgptexporter.e1fixture org.isomorphisms.webview.BridgeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 e682e0c865ba87d4793e3a4e62ebf6864db2b188 41990459787 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/pasteboard/pasteboard-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-pasteboard" "${{ matrix.api }}" com.isomorphisms.pasteboard android.app.NativeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 df2df8f18840c98a175b958f07749bb423e80ff0 41990472251 portrait
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/chord/android/chordreader-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-chord" "${{ matrix.api }}" org.isomorphisms.chordreader.dev org.isomorphisms.NativeViewActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 bd7d6be5b09b77f371bd97302002ddc8966d543c 41990465047 landscape
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: priority-lifecycle-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/charcoal-lifecycle-*
          if-no-files-found: warn
