name: Priority charcoal lifecycle and startup capture
on:
  pull_request:
    paths:
      - charcoal/observe-lifecycle.grease
      - charcoal/activity-match.grease
      - charcoal/qualify-activity-match.grease
      - charcoal/check-frame.grease
      - charcoal/check-startup-video.grease
      - charcoal/qualify-video-guard.grease
      - .github/workflows/charcoal-lifecycle.yml
      - examples/autogenerated/charcoal-lifecycle/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 42005246209
          artifact-ids: 13404806762
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/fastchat
      - run: echo 'b56e31ebee849e6faadd0c0b5c399ffa259b6f5a5e3b532573333db025ae47a4  candidate/fastchat/fastchat.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          run-id: 42005259942
          artifact-ids: 13406667414
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/ib
      - run: echo 'bb96fdc3576edfae62b5eea166043297fcd2f3458cdafc2388ecd8cb89131aa2  candidate/ib/native-client/ib-native-boundary.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/ChatGPTExporter
          run-id: 42005266500
          artifact-ids: 13403864526
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/exporter
      - run: echo 'f9f54d35287ab858885602ec0c83a57127d3341e6848e051d0be7d3b79db8100  candidate/exporter/production-reader.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 42005277456
          artifact-ids: 13404523390
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/pasteboard
      - run: echo 'a22e6e27ebb08277fd746c232caf81fa19495426780992dd398f40f688b91b13  candidate/pasteboard/pasteboard-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/tablature
          run-id: 42005268924
          artifact-ids: 13406241036
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/chord
      - run: echo 'c09868171411dee7e583be5f933396a4bd93475a13eb6efd8b5ab9fdcf52a052  candidate/chord/android/chordreader-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: '"$CHARCOAL_GREASE" charcoal/qualify-activity-match.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/charcoal-activity-match"'
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Require decoded-video positive and one-white-frame rejection
        run: '"$CHARCOAL_GREASE" charcoal/qualify-video-guard.grease "$GITHUB_WORKSPACE" "$(command -v ffmpeg)" "$RUNNER_TEMP/charcoal-video-guard"'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: |
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/fastchat/fastchat.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-fastchat" "${{ matrix.api }}" org.isomorphisms.fastchat.diskstreaming.arena android.app.NativeActivity aa9151e3922fa4795987c3655bc7aa4712620f1d94c24a2075acd7b29d8ac86e 07b609e3c30c54d361149f739785a57a51514efb 42005246209 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/ib/native-client/ib-native-boundary.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-ib" "${{ matrix.api }}" org.isomorphisms.ib.prepaint Idric.Generated de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 5804675143eb96f839b35b9bbc462cc8088bbda2 42005259942 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/exporter/production-reader.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-exporter" "${{ matrix.api }}" org.isomorphisms.chatgptexporter.e1fixture org.isomorphisms.webview.BridgeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 95b22de048f1d9496a456f67cd4b81c9f3f92dd1 42005266500 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/pasteboard/pasteboard-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-pasteboard" "${{ matrix.api }}" com.isomorphisms.pasteboard android.app.NativeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 ae857b6178c1a8e3a7887574122fa3d9661eeb0e 42005277456 portrait
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/chord/android/chordreader-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-chord" "${{ matrix.api }}" org.isomorphisms.chordreader.dev org.isomorphisms.NativeViewActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 fa5419214fcb9b8f1e90893734391aa655f9b9a3 42005268924 landscape
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: priority-lifecycle-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/charcoal-lifecycle-*
          if-no-files-found: warn
