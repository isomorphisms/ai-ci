name: Priority charcoal lifecycle and startup capture
on:
  pull_request:
    paths:
      - charcoal/observe-lifecycle.grease
      - charcoal/check-frame.grease
      - .github/workflows/charcoal-lifecycle.yml
      - examples/autogenerated/charcoal-lifecycle/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 41947171842
          artifact-ids: 13378669150
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/fastchat
      - run: echo '6cffa8b16a8ae5a8d221f135d5939bd3d346298cd5b166ef4af9c4c23b8f9ca1  candidate/fastchat/fastchat.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          run-id: 41947425729
          artifact-ids: 13380884545
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/ib
      - run: echo '6c32c502a41c99d71f937c5d6b362139ed8f396d3966993db80d2599dad9062f  candidate/ib/native-client/ib-native-boundary.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/ChatGPTExporter
          run-id: 41947436588
          artifact-ids: 13380610037
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/exporter
      - run: echo '01133a05d9d5b1ecd32781dd76140a65f94930488ce2c6e7d9b027ac34823261  candidate/exporter/production-reader.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          run-id: 41946125428
          artifact-ids: 13378759643
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/pasteboard
      - run: echo '6c418d259ef08e4682da7e15090f35d29fcc8323ac39f346c1e7db289273c313  candidate/pasteboard/pasteboard-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/tablature
          run-id: 41950607269
          artifact-ids: 13382136270
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate/chord
      - run: echo '73a56704f96fe967c623d2d73d0b5199b668ab5037ff2063328a8505d6205eb1  candidate/chord/android/chordreader-x86_64.apk' | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: |
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/fastchat/fastchat.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-fastchat" "${{ matrix.api }}" org.isomorphisms.fastchat.diskstreaming.arena android.app.NativeActivity aa9151e3922fa4795987c3655bc7aa4712620f1d94c24a2075acd7b29d8ac86e 8fda332e45dc96c16b4aae9955f180d475800b9c 41947171842 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/ib/native-client/ib-native-boundary.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-ib" "${{ matrix.api }}" org.isomorphisms.ib.prepaint Idric.Generated de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 f2b16841e4be8d51a4b4a88cc4264fc6681bce13 41947425729 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/exporter/production-reader.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-exporter" "${{ matrix.api }}" org.isomorphisms.chatgptexporter.e1fixture org.isomorphisms.webview.BridgeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 51bace2e9b026f0f5219d49fdf5ccaac89cb2321 41947436588 landscape
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/pasteboard/pasteboard-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-pasteboard" "${{ matrix.api }}" com.isomorphisms.pasteboard android.app.NativeActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 e3b018bfa12cd1d33cfd8ee4934ef3ce688c2a66 41946125428 portrait
            "$CHARCOAL_GREASE" charcoal/observe-lifecycle.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$ANDROID_HOME" "$GITHUB_WORKSPACE/candidate/chord/android/chordreader-x86_64.apk" "$CHARCOAL_GREASE" "$RUNNER_TEMP/charcoal-lifecycle-chord" "${{ matrix.api }}" org.isomorphisms.chordreader.dev org.isomorphisms.NativeViewActivity de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 7255ad083a1c183c42f9766ca3548c256e090daa 41950607269 landscape
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: priority-lifecycle-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/charcoal-lifecycle-*
          if-no-files-found: warn
