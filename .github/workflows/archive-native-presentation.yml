name: Independent signed native archive presentation
on:
  pull_request:
    paths:
      - charcoal/**
      - '!charcoal/*.md'
      - '!charcoal/*.tsv'
      - '!charcoal/*.txt'
      - '!charcoal/patches/**'
      - .github/workflows/archive-native-presentation.yml
      - examples/autogenerated/native-presentation/prepare-archive-requalification.grease
      - examples/autogenerated/native-presentation/observe-archive-requalification.grease
      - examples/autogenerated/native-presentation/observe-archive-ui.grease
      - examples/autogenerated/native-presentation/ArchiveUi.smali
      - examples/autogenerated/native-presentation/ArchiveUiTask.smali
      - examples/autogenerated/native-presentation/ArchiveFrameProbe.smali
      - examples/autogenerated/native-presentation/FrameTask.smali
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-archive-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-archive:
    name: Exact signed archive API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
      ARCHIVE_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ChatGPTExporter
          ref: 51bace2e9b026f0f5219d49fdf5ccaac89cb2321
          path: product
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x "$ARCHIVE_GREASE"
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: signer
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;36.0.0 platforms;android-34'
      - name: Verify immutable producer bytes and independently reconstruct its actual C1 archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          "$ARCHIVE_GREASE" examples/autogenerated/native-presentation/prepare-archive-requalification.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/product" 51bace2e9b026f0f5219d49fdf5ccaac89cb2321
          13380610037 847435e8e64c764f407fece723c45dd0710164068d765fd15a5f323cee534991
          "${{ steps.ick.outputs.compiler }}" "$ANDROID_HOME" "$RUNNER_TEMP/archive-input"
      - name: Foreign test assembler, never the product DEX producer
        run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - run: sudo chmod 666 /dev/kvm
      - name: Observe unchanged production UI, actual provenance and actual broken producer
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            "$ARCHIVE_GREASE" examples/autogenerated/native-presentation/observe-archive-requalification.grease
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/archive-input" "$ANDROID_HOME"
            "$GITHUB_WORKSPACE/signer/_/build/app/wegert-debug.keystore" "$GITHUB_WORKSPACE/smali.jar"
            "$ARCHIVE_GREASE" "$RUNNER_TEMP/archive-observed" "${{ matrix.api }}"
      - name: Preserve source-bound independent evidence even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-archive-API${{ matrix.api }}-51bace2e-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/archive-input/*.tsv
            ${{ runner.temp }}/archive-input/*.txt
            ${{ runner.temp }}/archive-input/*.sha256
            ${{ runner.temp }}/archive-observed
