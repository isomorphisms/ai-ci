name: Source-bound requirement projection
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  projection:
    name: ${{ github.event_name == 'pull_request' && 'requirement-projection' || format('requirement-projection-{0}', github.event_name) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact ai-ci source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out qualified checked Ithon interface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Reject stale ambiguous and misplaced obligations
        env:
          PYTHONPATH: ${{ github.workspace }}/validators
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/requirement-projection-checked.jsonl
        run: _ithon/ithon tests/requirement-projection/check.pi "$GITHUB_WORKSPACE" "$RUNNER_TEMP/requirement-projection"
      - name: Retain exact projections and case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: requirement-projection-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            requirements/projections/
            ${{ runner.temp }}/requirement-projection/
            ${{ runner.temp }}/requirement-projection-checked.jsonl
          if-no-files-found: error
  request-binding-source:
    name: ${{ github.event_name == 'pull_request' && 'request-binding-source' || format('request-binding-source-{0}', github.event_name) }}
    needs: projection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact ai-ci source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact existing FP public entrypoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: 146408ab64fe52c62edaa414126cae5ec952b3ca
          path: _fp
          persist-credentials: false
      - name: Check out exact Kitchen generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 32c3bf2d7c6268b50f1e48395dc972cfbafec7a9
          path: _kitchen
          persist-credentials: false
      - name: Check out exact checked Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: _ithon
          persist-credentials: false
      - name: Acquire partial native Grease for scoped source checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14166313138'
          run-id: '43726139851'
          repository: dilapidated-shed/oils
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _grease-partial
      - name: Verify exact native runtime bytes
        shell: sh
        run: sha256sum --check --strict requirements/native-grease-source.sha256
      - name: Name the exact transported executable for consumers
        shell: sh
        run: install -m 755 _grease-partial/ysh-d _grease-partial/grease
      - name: Run the complete public source fixture suite
        env:
          PYTHONPATH: ${{ github.workspace }}/_fp/scripts:${{ github.workspace }}/validators
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/request-binding-source-checked.jsonl
        run: _ithon/ithon tests/job-delivery/check.pi "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_fp" "$RUNNER_TEMP/request-binding-source" "$GITHUB_WORKSPACE/_ithon/ithon" "$GITHUB_WORKSPACE/_kitchen" "$GITHUB_WORKSPACE/_grease-partial/grease"
      - name: Retain scoped host-source observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: request-binding-source-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            requirements/native-grease-source.sha256
            requirements/native-grease-source.tsv
            ${{ runner.temp }}/request-binding-source/
            ${{ runner.temp }}/request-binding-source-checked.jsonl
