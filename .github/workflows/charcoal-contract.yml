name: Charcoal palette and exact contrast contract
on:
  pull_request:
    paths:
      - charcoal/qualify-contract.grease
      - charcoal/check-frame.grease
      - charcoal/self-test.grease
      - charcoal/check-tokens.grease
      - charcoal/test-tokens.grease
      - examples/autogenerated/charcoal-contrast/**
      - .github/workflows/charcoal-contract.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 3e682fb1175beef5625dbd2418730220e49fc9bd
          path: shared
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/ib
          run-id: 41943979892
          artifact-ids: 13378097499,13377194480,13377323740,13377408508
          merge-multiple: true
          github-token: ${{ github.token }}
          path: retained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - name: Stage canonical Grease launcher and unchanged host engine
        uses: ./.github/actions/charcoal-grease
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - name: Compile exact integer contrast and reject native, XML and white-frame mutations
        run: >
          "$CHARCOAL_GREASE" charcoal/qualify-contract.grease "$CHARCOAL_GREASE"
          "$GITHUB_WORKSPACE/retained" "$GITHUB_WORKSPACE/shared/native/presentation"
          "$RUNNER_TEMP/charcoal-contract"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charcoal-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/charcoal-contract/receipt.tsv
            ${{ runner.temp }}/charcoal-contract/frontend.sha256
            ${{ runner.temp }}/charcoal-contract/contrast/*.txt
            ${{ runner.temp }}/charcoal-contract/palette/*.txt
            ${{ runner.temp }}/charcoal-contract/frames
          if-no-files-found: warn
