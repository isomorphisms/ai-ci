name: Release promotion guards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check shell syntax
        run: |
          for script in release-promotion/*.sh; do bash -n "$script"; done
      - name: Reject unsafe promotions and prove identical retries
        run: bash release-promotion/test.sh
