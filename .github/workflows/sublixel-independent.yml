name: Independent Sublixel ICK + Ike curvature acceptance

on:
  pull_request:
    paths:
      - 'sublixel/**'
      - '.github/workflows/sublixel-independent.yml'
  push:
    branches:
      - 'accept/sublixel-*'
    paths:
      - 'sublixel/**'
      - '.github/workflows/sublixel-independent.yml'

permissions:
  contents: read

jobs:
  independent-curvature:
    name: ICK-built independent rational oracle and source mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out independent ai-ci source at PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact 3x3+5x5 producer candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/rough.framebuffer
          ref: 49aa03cdeabbc57dbac758e0a9470579c3af0015
          path: producer
          persist-credentials: false

      - name: Check out owned ICK compiler and pinned reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ick
          ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
          path: ick-toolchain
          submodules: true
          persist-credentials: false

      - name: Check out owned Ike orchestrator source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ike
          ref: a92fe68bf8aad8dfcfe9f7a7abd84e07290f7fe0
          path: ike-toolchain
          persist-credentials: false

      - name: Verify immutable source revisions and locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = 49aa03cdeabbc57dbac758e0a9470579c3af0015
          test "$(git -C ick-toolchain rev-parse HEAD)" = c61e448251744a2f40ad743ebef1a027bdcd2f9d
          test "$(git -C ick-toolchain/gcc rev-parse HEAD)" = 6294f1d9e7536e5ffcde09d1528c918d63abfef5
          grep -Fxq gcc_commit=6294f1d9e7536e5ffcde09d1528c918d63abfef5 ick-toolchain/ick/SOURCE.lock
          test "$(git -C ike-toolchain rev-parse HEAD)" = a92fe68bf8aad8dfcfe9f7a7abd84e07290f7fe0

      - name: Install stage-zero ICK compiler build dependencies only
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev binutils

      - name: Materialize source-built ICK (no consumer fallback)
        shell: bash
        run: |
          set -euo pipefail
          cd ick-toolchain
          sh ick/materialize.sh gcc source
          test -d source/gcc/c
          test -d source/gcc/c-family

      - name: Configure ICK native C compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ick-toolchain/build ick-toolchain/stage
          cd ick-toolchain/build
          ../source/configure \
            --target=x86_64-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/ick-toolchain/stage" \
            --with-as="$(command -v x86_64-linux-gnu-as)" \
            --with-ld="$(command -v x86_64-linux-gnu-ld)" \
            --enable-languages=c \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv

      - name: Build pinned ICK compiler using declared stage-zero GNU Make
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/make -C ick-toolchain/build -j2 all-gcc
          /usr/bin/make -C ick-toolchain/build install-gcc

      - name: Build pinned Ike with ICK (not host GCC)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .owned
          ./ick-toolchain/stage/bin/x86_64-linux-gnu-gcc \
            -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC \
            -c ike-toolchain/ike.c -o .owned/ike.o
          readelf -h .owned/ike.o | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          /usr/bin/x86_64-linux-gnu-gcc .owned/ike.o -o .owned/ike
          sha256sum .owned/ike.o .owned/ike

      - name: Run independently authored rational oracle and four real mutants via Ike
        shell: bash
        run: |
          set -euo pipefail
          export ICK_SOURCE_DIR="$GITHUB_WORKSPACE/ick-toolchain"
          export ICK_CC="$ICK_SOURCE_DIR/stage/bin/x86_64-linux-gnu-gcc"
          export LEAF_ROOT="$GITHUB_WORKSPACE/producer"
          export HOST_LINKER=/usr/bin/x86_64-linux-gnu-gcc
          cd sublixel
          mkdir -p build
          export IKE_IKEFILE_IDENTITY="sha256:$(sha256sum Ikefile | cut -d ' ' -f1)"
          export IKE_RECEIPT="$PWD/build/ike-accept.tsv"
          unset IKE_RECIPE_RUNNER
          "$GITHUB_WORKSPACE/.owned/ike" accept | tee build/accept-stdout.log
          grep -Fxq 'AICI_SUBLIXEL_ACCEPT independent 3x3/5x5 rational coverage and four source mutants: PASS' \
            build/accept-stdout.log
          ./build/receipt-check "$IKE_RECEIPT" "$IKE_IKEFILE_IDENTITY"

      - name: Prove independent receipt checker rejects forged results
        shell: bash
        run: |
          set -euo pipefail
          cd sublixel
          identity="sha256:$(sha256sum Ikefile | cut -d ' ' -f1)"
          awk '{ if ($0 == "final_result\tPASS") print "final_result\tFAIL"; else print }' \
            build/ike-accept.tsv > build/bad-final.tsv
          if ./build/receipt-check build/bad-final.tsv "$identity" \
               > build/bad-final.out 2>&1; then
            echo 'Accepted forged final receipt PASS' >&2
            exit 1
          fi
          grep -Fq 'AICI_SUBLIXEL_RECEIPT_REJECT final result' build/bad-final.out
          awk -F '\t' '{ if ($1 == "selected_target_hex") print "selected_target_hex\t00"; else print }' \
            build/ike-accept.tsv > build/bad-target.tsv
          if ./build/receipt-check build/bad-target.tsv "$identity" \
               > build/bad-target.out 2>&1; then
            echo 'Accepted forged target receipt' >&2
            exit 1
          fi
          grep -Fq 'AICI_SUBLIXEL_RECEIPT_REJECT selected target' build/bad-target.out
          echo 'AICI exact Ike receipt negative controls: PASS'
