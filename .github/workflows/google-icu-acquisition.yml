name: Independent actual ICU Google acquisition matrix
on:
  pull_request:
    paths:
      - '.github/workflows/google-icu-acquisition.yml'
      - 'ib-source/reader/classify-google.grease'
      - 'ib-source/reader/test-google-classification.grease'
      - 'examples/autogenerated/google-result-classification/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/icu
          ref: 4f36574be653eba6a603c4d0d79b02a7250d5154
          path: .tools/icu
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/Idric-Net
          ref: b21801b72acb8ab835c297bbe298af8599550134
          path: .tools/Idric-Net
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build declared Grease runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install declared TLS and independent HTML dependencies
        shell: sh
        run: make -f ick-host/Makefile extra-packages ICK_BUILD="$RUNNER_TEMP/ick-host-build" PACKAGES='libssl-dev libxml2-utils ripgrep'
      - name: Restore the exact maintained frontend
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: google-icu-idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-fbe86e23-ubuntu24-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Bootstrap the exact maintained frontend
        if: steps.frontend.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Retain the exact maintained frontend
        if: steps.frontend.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build unchanged source and require the command checks
        shell: sh
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          CHEZ: ${{ github.workspace }}/.tools/Idric/_/.tools/bin/scheme
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/google-result-classification/build-icu.grease "$GITHUB_WORKSPACE" "$ICK" "$RUNNER_TEMP/Google-icu-build"
      - name: Require independent semantic positives and refusals
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease ib-source/reader/test-google-classification.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/runtime/.build/grease/bin/grease" "$RUNNER_TEMP/Google-classifier"
      - name: Acquire real public Google responses through the actual checked ICU command
        shell: sh
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/icu
        run: .tools/runtime/.build/grease/bin/grease .tools/icu/examples/autogenerated/google-acquisition/capture.grease "$GITHUB_WORKSPACE/.tools/icu/build/exec/icu" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/runtime/.build/grease/bin/grease" "$RUNNER_TEMP/Google-acquisition"
      - name: Retain original private captures and source-bound build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Actual-ICU-Google-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/Google-icu-build
            ${{ runner.temp }}/Google-classifier
            ${{ runner.temp }}/Google-acquisition
          if-no-files-found: warn
